<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>N 皇后推演 DEV</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('../index.html', { cache: 'no-store' });
  let html = await response.text();

  const oldCycle = "function cycleCell(r,c){const x=cells[r][c];pushAction('手動：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:(x.state+1)%3}]);render()}";
  const newCycle = `function cycleCell(r,c){
    const now=Date.now(),x=cells[r][c],pending=cycleCell.pending;
    const same=!!pending&&pending.row===r&&pending.col===c&&now-pending.started<=1000;

    // 皇后單點直接清空。
    if(x.state===2){
      cycleCell.pending=null;
      pushAction('手動清除皇后：('+(c+1)+','+(r+1)+')',[{row:r,col:c,newState:0}]);
      render();
      return;
    }

    // X 在建立後 1 秒內再次點同一格 => 皇后。
    // 其他情況單點既有 X => 清空。
    if(x.state===1){
      if(same){
        x.state=2;
        if(pending.entry) pending.entry.label='手動皇后：('+(c+1)+','+(r+1)+')';
        else{
          hist.push({label:'手動皇后：('+(c+1)+','+(r+1)+')',type:'manual',changes:[{row:r,col:c,state:1}]});
          opCount++;
        }
        cycleCell.pending=null;
        touchState(cells);validateQueens();render();
        return;
      }
      cycleCell.pending=null;
      pushAction('手動清除 X：('+(c+1)+','+(r+1)+')',[{row:r,col:c,newState:0}]);
      render();
      return;
    }

    // 空白格第一次點擊：立即成為 X，並開始 1 秒雙擊判定。
    pushAction('手動 X：('+(c+1)+','+(r+1)+')',[{row:r,col:c,newState:1}]);
    render();
    cycleCell.pending={row:r,col:c,started:Date.now(),entry:hist[hist.length-1]};
  }`;
  if (html.includes(oldCycle)) html = html.replace(oldCycle, newCycle);

  const devStyle = `
  <style id="nq-dev-ui-style">
    body.nq-dev-ready .toolbar { gap:10px; position:relative; overflow:visible; }
    body.nq-dev-ready .toolbar #random,
    body.nq-dev-ready .toolbar #edit,
    body.nq-dev-ready .toolbar #undo,
    body.nq-dev-ready .toolbar #clear,
    body.nq-dev-ready .toolbar .stats { display:none!important; }
    body.nq-dev-ready #mode { display:none!important; }
    .dev-edit-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
    .dev-edit-actions .region-color-tools { margin:0; width:auto; }
    .dev-edit-actions .region-color-panel { width:100%; flex-basis:100%; }
    .dev-clear-board { font-weight:700; }
    .dev-play-actions { display:none; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 8px; }
    body.nq-play-mode .dev-play-actions { display:flex; }
    body.nq-play-mode .dev-edit-actions,
    body.nq-play-mode #palette,
    body.nq-play-mode .region-color-tools,
    body.nq-play-mode .region-legend,
    body.nq-play-mode .play-guide .guide-card:nth-child(2) { display:none!important; }
    .dev-rule-tip { display:none; margin:0; }
    body.nq-play-mode .dev-rule-tip { display:inline-flex; }
    body.nq-play-mode .play-guide:not(.dev-open) { display:none!important; }
    body.nq-play-mode .play-guide.dev-open { display:grid!important; width:100%; margin-top:0; }
    .dev-play-actions #stepSolve,.dev-play-actions #autoQueen { margin:0!important; }
    .dev-play-actions:not(.solver-unlocked) #stepSolve,.dev-play-actions:not(.solver-unlocked) #autoQueen { display:none!important; }
    .dev-play-actions.solver-unlocked #stepSolve,.dev-play-actions.solver-unlocked #autoQueen { display:inline-block!important; }
    body.nq-play-mode .toolbar > span:first-child,body.nq-play-mode .toolbar #n,body.nq-play-mode .toolbar #new { display:none!important; }
    body.nq-play-mode .toolbar #play { margin-right:auto; }
    body:not(.nq-play-mode) .annotation-tools { display:none!important; }

    .dev-operation-tip{display:none;margin-left:auto}
    body.nq-play-mode .dev-operation-tip{display:inline-flex}
    .dev-operation-panel{display:none;position:absolute;right:16px;top:calc(100% + 8px);z-index:120;width:min(390px,calc(100vw - 40px));padding:12px 14px;border:1px solid #eaded8;border-radius:12px;background:#fff;box-shadow:0 10px 28px #0002;line-height:1.65;font-size:13px}
    body.nq-play-mode .dev-operation-panel.open{display:block}
    .dev-operation-panel b{display:block;margin-bottom:5px;font-size:14px}
    .dev-operation-panel div{margin:2px 0}

    @media(max-width:850px){.dev-edit-actions,.dev-play-actions{gap:6px}.dev-operation-panel{right:8px}}
  </style>`;

  const patchScript = `
  <scr` + `ipt>
  (() => {
    const ready = (fn) => { const tick=()=>{ if(window.nqApp&&document.querySelector('.annotation-tools')&&document.querySelector('.region-color-tools')) fn(); else setTimeout(tick,40); }; tick(); };
    ready(() => {
      if(document.body.classList.contains('nq-dev-ready')) return;
      document.body.classList.add('nq-dev-ready');
      const app=window.nqApp, toolbar=document.querySelector('.toolbar'), mainPanel=document.querySelector('.main .panel'), board=document.querySelector('#board'), history=document.querySelector('#history'), newBtn=document.querySelector('#new'), randomBtn=document.querySelector('#random'), editBtn=document.querySelector('#edit'), playBtn=document.querySelector('#play'), undoBtn=document.querySelector('#undo'), clearBtn=document.querySelector('#clear'), solver=document.querySelector('#solver'), stepBtn=document.querySelector('#stepSolve'), autoBtn=document.querySelector('#autoQueen'), colorTools=document.querySelector('.region-color-tools'), guide=document.querySelector('.play-guide'), annotationTools=document.querySelector('.annotation-tools'), palette=document.querySelector('#palette');
      if(!toolbar||!mainPanel||!board||!history||!newBtn||!randomBtn||!editBtn||!playBtn||!undoBtn||!clearBtn||!solver||!stepBtn||!autoBtn||!colorTools||!annotationTools||!palette) return;
      newBtn.textContent='設定棋盤大小'; playBtn.textContent='開始推演'; randomBtn.textContent='產生隨機棋盤'; undoBtn.textContent='上一步'; clearBtn.textContent='清空'; stepBtn.textContent='推演一步'; autoBtn.textContent='推演到下一個皇后';

      const operationTip=document.createElement('button');
      operationTip.type='button'; operationTip.className='dev-operation-tip'; operationTip.textContent='💡 操作 Tips';
      const operationPanel=document.createElement('div');
      operationPanel.className='dev-operation-panel';
      operationPanel.innerHTML='<b>操作說明</b><div>單點空白格：標記 X。</div><div>同一格 1 秒內連點兩下：放置皇后。</div><div>超過 1 秒後再單點 X：清空該格。</div><div>改點其他空白格：原本的 X 保留，新格重新開始 1 秒判定。</div><div>單點皇后：清空該格。</div><div>拖曳空白格：連續畫 X；從 X 開始拖曳：連續清除 X。</div>';
      toolbar.append(operationTip,operationPanel);
      operationTip.addEventListener('click',()=>operationPanel.classList.toggle('open'));
      document.addEventListener('pointerdown',(event)=>{if(!operationPanel.classList.contains('open'))return;if(operationPanel.contains(event.target)||operationTip.contains(event.target))return;operationPanel.classList.remove('open');});

      const editActions=document.createElement('div'); editActions.className='dev-edit-actions'; mainPanel.insertBefore(editActions,palette); editActions.appendChild(randomBtn);
      const clearBoard=document.createElement('button'); clearBoard.type='button'; clearBoard.className='dev-clear-board'; clearBoard.textContent='清空棋盤'; clearBoard.addEventListener('click',()=>{ if(app.isPlayMode()) editBtn.click(); const snapshot=app.getBoard(); app.installBoard({size:snapshot.size,cells:snapshot.cells.map(cell=>({...cell,regionId:-1,state:0}))}); requestAnimationFrame(syncMode); }); editActions.appendChild(clearBoard); editActions.appendChild(colorTools); const colorToggle=colorTools.querySelector('.region-color-toggle'); if(colorToggle) colorToggle.textContent='🎨 設定色塊顏色';
      const playActions=document.createElement('div'); playActions.className='dev-play-actions'; annotationTools.insertAdjacentElement('afterend',playActions);
      const tipsBtn=document.createElement('button'); tipsBtn.type='button'; tipsBtn.className='dev-rule-tip'; tipsBtn.textContent='💡 規則 Tips'; playActions.append(tipsBtn,undoBtn,clearBtn,stepBtn,autoBtn); if(guide){playActions.insertAdjacentElement('afterend',guide); guide.classList.remove('dev-open'); tipsBtn.addEventListener('click',()=>guide.classList.toggle('dev-open'));}
      const syncUnlock=()=>playActions.classList.toggle('solver-unlocked',solver.style.display==='block'); new MutationObserver(syncUnlock).observe(solver,{attributes:true,attributeFilter:['style']}); newBtn.addEventListener('click',()=>requestAnimationFrame(syncUnlock)); syncUnlock();
      const syncMode=()=>{const play=!!app.isPlayMode(); document.body.classList.toggle('nq-play-mode',play); playBtn.textContent=play?'離開推演模式':'開始推演'; if(!play){if(guide)guide.classList.remove('dev-open');operationPanel.classList.remove('open');}};
      playBtn.addEventListener('click',(event)=>{if(!app.isPlayMode())return; event.preventDefault();event.stopImmediatePropagation();editBtn.click();requestAnimationFrame(syncMode);},true);

      let eraseDrag=null; const cellAtPoint=(x,y)=>{const element=document.elementFromPoint(x,y),cell=element&&element.closest?element.closest('.cell'):null;if(!cell||!board.contains(cell))return null;return{row:Number(cell.dataset.row),col:Number(cell.dataset.col)}}; const boardCellState=(p)=>{const cell=app.getBoard().cells.find(i=>i.row===p.row&&i.col===p.col);return cell?cell.state:-1}; const addEraseCoordinate=(p)=>{if(!eraseDrag||!p)return;const key=p.col+','+p.row;if(eraseDrag.seen.has(key)||boardCellState(p)!==1)return;eraseDrag.seen.add(key);eraseDrag.coords.push([p.col+1,p.row+1]);};
      board.addEventListener('pointerdown',(e)=>{if(!app.isPlayMode())return;const start=cellAtPoint(e.clientX,e.clientY);if(!start||boardCellState(start)!==1){eraseDrag=null;return;}eraseDrag={start,moved:false,seen:new Set(),coords:[]};},true);
      board.addEventListener('pointermove',(e)=>{if(!eraseDrag||!app.isPlayMode())return;const hit=cellAtPoint(e.clientX,e.clientY);if(!hit)return;if(hit.row!==eraseDrag.start.row||hit.col!==eraseDrag.start.col){if(!eraseDrag.moved){eraseDrag.moved=true;addEraseCoordinate(eraseDrag.start);}addEraseCoordinate(hit);}},true);
      const finishEraseDrag=()=>{const completed=eraseDrag;eraseDrag=null;if(!completed||!completed.moved||!completed.coords.length)return;const label='拖曳清除 X：['+completed.coords.map(([x,y])=>'('+x+','+y+')').join(',')+']';requestAnimationFrame(()=>{const target=Array.from(history.querySelectorAll('.item')).find(item=>(item.textContent||'').trim().startsWith('拖曳清除 X：'));if(target)target.textContent=label;});}; board.addEventListener('pointerup',finishEraseDrag,true);board.addEventListener('pointercancel',finishEraseDrag,true);
      editBtn.addEventListener('click',()=>requestAnimationFrame(syncMode));newBtn.addEventListener('click',()=>requestAnimationFrame(syncMode));randomBtn.addEventListener('click',()=>requestAnimationFrame(syncMode));new MutationObserver(()=>requestAnimationFrame(syncMode)).observe(board,{childList:true,subtree:false});syncMode();
    });
  })();
  </scr` + `ipt>`;
  html=html.replace('<head>','<head><base href="../">').replace('</head>',devStyle+'</head>'); html=html.replace('</body>',patchScript+'</body>'); document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML='<pre style="padding:24px">DEV 載入失敗：'+String(error)+'</pre>';});
</script>
</body>
</html>
