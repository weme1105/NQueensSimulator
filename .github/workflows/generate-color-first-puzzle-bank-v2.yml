name: Generate Color-First Puzzle Bank v2

on:
  workflow_dispatch:
    inputs:
      target_per_size:
        description: 'Accepted puzzles per board size'
        required: false
        default: '50'
        type: string
      sizes:
        description: 'Comma-separated sizes'
        required: false
        default: '6,7,8,9,10'
        type: string
  push:
    paths:
      - 'src/solver/colorFirstGenerator.ts'
      - 'src/solver/solutionTelemetry.ts'
      - 'src/solver/puzzleFingerprint.ts'
      - 'scripts/generateColorFirstBank.ts'
      - '.github/workflows/generate-color-first-puzzle-bank-v2.yml'

permissions:
  contents: write

env:
  TARGET_PER_SIZE: ${{ inputs.target_per_size || '50' }}
  SIZES: ${{ inputs.sizes || '6,7,8,9,10' }}

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        size: [6, 7, 8, 9, 10]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx --yes tsx scripts/generateColorFirstBank.ts
        env:
          SIZES: ${{ matrix.size }}
          TARGET_PER_SIZE: ${{ env.TARGET_PER_SIZE }}
          MAX_ATTEMPTS: 200000

      - uses: actions/upload-artifact@v4
        with:
          name: color-first-v2-${{ matrix.size }}
          path: data/generated/basic/puzzle-bank-${{ matrix.size }}.json
          if-no-files-found: error

  commit-bank:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: color-first-v2-*
          path: /tmp/color-first-banks
          merge-multiple: false

      - name: Copy generated banks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated/basic
          for size in 6 7 8 9 10; do
            src="/tmp/color-first-banks/color-first-v2-${size}/puzzle-bank-${size}.json"
            if [[ -f "$src" ]]; then
              cp "$src" "data/generated/basic/puzzle-bank-${size}.json"
            fi
          done

      - name: Commit generated banks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/basic/puzzle-bank-*.json
          if git diff --cached --quiet; then
            echo 'No bank changes to commit.'
            exit 0
          fi
          git commit -m "chore: refresh color-first v2 puzzle bank"
          git push origin HEAD:${{ github.ref_name }}
