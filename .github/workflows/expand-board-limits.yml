name: Expand board limits
on:
  push:
    paths:
      - '.github/workflows/expand-board-limits.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('id="n" type="number" min="4" max="12"', 'id="n" type="number" min="4" max="20"', 1)
          s = s.replace("function build(){N=Math.max(4,Math.min(12,+$('n').value||8));", "function build(){N=Math.max(4,Math.min(20,+$('n').value||8));", 1)
          s = s.replace("'#ffd97d','#e983d3','#64c96d','#7bb2d8']", "'#ffd97d','#e983d3','#64c96d','#7bb2d8','#ef8a62','#9b8ad6','#5bb7a7','#d77c94','#6f9fd8','#a7c957','#f2a65a','#8d99ae']", 1)
          old = "async function randomUniquePuzzle(){N=Math.max(4,Math.min(12,+$('n').value||8));$('n').value=N;"
          new = "async function randomUniquePuzzle(){const requested=Math.max(4,Math.min(20,+$('n').value||8));if(requested>12){setStatus('隨機唯一題目最大支援 12×12；手動棋盤可使用到 20×20。','warn');return}N=requested;$('n').value=N;"
          s = s.replace(old, new, 1)
          s = s.replace("setStatus('空白棋盤已建立。請設定 '+N+' 個相連色塊。')", "setStatus('空白棋盤已建立。請設定 '+N+' 個相連色塊（手動最大 20×20）。')", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: allow manual boards up to 20x20"
          git push
