name: Batch drag history
on:
  push:
    paths:
      - '.github/workflows/batch-drag-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Batch drag edits into one operation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="let N=8,cells=[],hist=[],opCount=0,mode='edit',selected=0,secret=0,unlocked=false,pointerActive=false,pointerMoved=false,pointerStart=null,visited=new Set(),playDragMode='paintX',playGeometry=null;"
          new="let N=8,cells=[],hist=[],opCount=0,mode='edit',selected=0,secret=0,unlocked=false,pointerActive=false,pointerMoved=false,pointerStart=null,visited=new Set(),playDragMode='paintX',playGeometry=null,dragHistoryChanges=[];"
          if old not in s: raise SystemExit('global drag marker not found')
          s=s.replace(old,new,1)

          old_drag="function dragPlayCell(r,c){const key=r+','+c;if(visited.has(key))return;visited.add(key);const x=cells[r][c];if(playDragMode==='eraseX'){if(x.state!==1)return;pushAction('清除 X：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:0}])}else{if(x.state!==0)return;pushAction('畫 X：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:1}])}updateCellVisual(r,c);updateStatsAndHistory()}"
          new_drag="function dragPlayCell(r,c){const key=r+','+c;if(visited.has(key))return;visited.add(key);const x=cells[r][c],next=playDragMode==='eraseX'?0:1;if(playDragMode==='eraseX'){if(x.state!==1)return}else if(x.state!==0)return;dragHistoryChanges.push({row:r,col:c,state:x.state});x.state=next;touchState(cells);updateCellVisual(r,c)}function commitDragHistory(){if(!dragHistoryChanges.length)return;hist.push({label:(playDragMode==='eraseX'?'拖曳清除 X':'拖曳畫 X')+'：'+dragHistoryChanges.length+' 格',type:'manual',changes:dragHistoryChanges.slice()});opCount++;dragHistoryChanges=[];validateQueens()}"
          if old_drag not in s: raise SystemExit('dragPlayCell marker not found')
          s=s.replace(old_drag,new_drag,1)

          # Reset drag batch on pointer start.
          old_pd="pointerActive=true;pointerMoved=false;visited=new Set();pointerStart="
          new_pd="pointerActive=true;pointerMoved=false;visited=new Set();dragHistoryChanges=[];pointerStart="
          if old_pd not in s: raise SystemExit('pointerdown marker not found')
          s=s.replace(old_pd,new_pd,1)

          # Commit batch once at pointer end, before final render.
          old_finish="pointerStart=null;if(mode==='edit')liveCheck();render()}"
          new_finish="if(mode==='play'&&pointerMoved)commitDragHistory();pointerStart=null;if(mode==='edit')liveCheck();render()}"
          if old_finish not in s: raise SystemExit('finishPointer marker not found')
          s=s.replace(old_finish,new_finish,1)

          # Pointer cancellation also commits already-applied drag changes so Undo remains coherent.
          old_cancel="board.addEventListener('pointercancel',()=>{pointerActive=false;pointerStart=null;if(mode==='edit')liveCheck();render()});"
          new_cancel="board.addEventListener('pointercancel',()=>{pointerActive=false;if(mode==='play')commitDragHistory();pointerStart=null;if(mode==='edit')liveCheck();render()});"
          if old_cancel not in s: raise SystemExit('pointercancel marker not found')
          s=s.replace(old_cancel,new_cancel,1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: batch drag edits into one history operation'
          git push
