name: Cache Hall masks
on:
  push:
    paths:
      - '.github/workflows/cache-hall-masks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Precompute Hall masks in solver snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const candidate=new Uint8Array(N*N),rowCandidates=new Uint16Array(N),colCandidates=new Uint16Array(N),regionCandidates=new Uint16Array(N);"
          new="const candidate=new Uint8Array(N*N),rowCandidates=new Uint16Array(N),colCandidates=new Uint16Array(N),regionCandidates=new Uint16Array(N),rowRegionMask=new Uint32Array(N),colRegionMask=new Uint32Array(N),regionRowMask=new Uint32Array(N),regionColMask=new Uint32Array(N);"
          if old not in s: raise SystemExit('snapshot arrays marker not found')
          s=s.replace(old,new,1)

          old_add="candidate[r*N+c]=1;rowCandidates[r]++;colCandidates[c]++;regionCandidates[x.regionId]++}const snap={version,queens,rowQueens,colQueens,regionQueens,candidate,rowCandidates,colCandidates,regionCandidates};"
          new_add="candidate[r*N+c]=1;rowCandidates[r]++;colCandidates[c]++;regionCandidates[x.regionId]++;rowRegionMask[r]|=1<<x.regionId;colRegionMask[c]|=1<<x.regionId;regionRowMask[x.regionId]|=1<<r;regionColMask[x.regionId]|=1<<c}const snap={version,queens,rowQueens,colQueens,regionQueens,candidate,rowCandidates,colCandidates,regionCandidates,rowRegionMask,colRegionMask,regionRowMask,regionColMask};"
          if old_add not in s: raise SystemExit('snapshot candidate marker not found')
          s=s.replace(old_add,new_add,1)

          # Replace Hall function setup with snapshot masks.
          old_h="function hallSubsetDeduction(src,kind,maxSize=5,minSize=2){const active=[];for(let i=0;i<N;i++){const u=unitCells(src,kind,i);if(!u.some(c=>c.state===2))active.push(i)}if(active.length<2)return null;const candidate=c=>isCandidate(c,src);const masks=new Uint32Array(N);for(const i of active){let mask=0;for(const c of unitCells(src,kind,i))if(candidate(c))mask|=1<<c.regionId;masks[i]=mask}"
          new_h="function hallSubsetDeduction(src,kind,maxSize=5,minSize=2){const snap=solverSnapshot(src),active=[];for(let i=0;i<N;i++)if(!(kind==='row'?snap.rowQueens[i]:snap.colQueens[i]))active.push(i);if(active.length<2)return null;const candidate=c=>isCandidate(c,src),masks=kind==='row'?snap.rowRegionMask:snap.colRegionMask;"
          if old_h not in s: raise SystemExit('hall setup marker not found')
          s=s.replace(old_h,new_h,1)

          old_r="function reverseHallRegionDeduction(src,kind,maxSize=5,minSize=2){const active=[];for(let region=0;region<N;region++){const u=unitCells(src,'region',region);if(!u.some(c=>c.state===2))active.push(region)}if(active.length<2)return null;const candidate=c=>isCandidate(c,src);const masks=new Uint32Array(N);for(const region of active){let mask=0;for(const c of unitCells(src,'region',region))if(candidate(c))mask|=1<<(kind==='row'?c.row:c.col);masks[region]=mask}"
          new_r="function reverseHallRegionDeduction(src,kind,maxSize=5,minSize=2){const snap=solverSnapshot(src),active=[];for(let region=0;region<N;region++)if(!snap.regionQueens[region])active.push(region);if(active.length<2)return null;const candidate=c=>isCandidate(c,src),masks=kind==='row'?snap.regionRowMask:snap.regionColMask;"
          if old_r not in s: raise SystemExit('reverse Hall setup marker not found')
          s=s.replace(old_r,new_r,1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: cache Hall candidate masks per solver state'
          git push
