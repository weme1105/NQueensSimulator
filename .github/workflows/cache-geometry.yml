name: Cache solver geometry
on:
  push:
    paths:
      - '.github/workflows/cache-geometry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache row column region geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const stateVersion=new WeakMap(),solverSnapshotCache=new WeakMap();"
          new="const stateVersion=new WeakMap(),solverSnapshotCache=new WeakMap(),geometryCache=new WeakMap();"
          if old not in s: raise SystemExit('cache globals marker not found')
          s=s.replace(old,new,1)

          marker="function touchState(src){stateVersion.set(src,(stateVersion.get(src)||0)+1);solverSnapshotCache.delete(src)}"
          helper=marker+"function touchRegions(src){geometryCache.delete(src);if(src===cells)playGeometry=null;touchState(src)}function geometryFor(src=cells){const cached=geometryCache.get(src);if(cached)return cached;const cols=Array.from({length:N},()=>[]),regions=Array.from({length:N},()=>[]);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];cols[c].push(x);if(x.regionId>=0)regions[x.regionId].push(x)}const g={cols,regions};geometryCache.set(src,g);return g}"
          if marker not in s: raise SystemExit('touchState marker not found')
          s=s.replace(marker,helper,1)

          old_build="function buildPlayGeometry(){const cols=Array.from({length:N},()=>[]),regions=Array.from({length:N},()=>[]);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cell=cells[r][c];cols[c].push(cell);if(cell.regionId>=0)regions[cell.regionId].push(cell)}playGeometry={cols,regions}}"
          new_build="function buildPlayGeometry(){playGeometry=geometryFor(cells)}"
          if old_build not in s: raise SystemExit('buildPlayGeometry marker not found')
          s=s.replace(old_build,new_build,1)

          old_region="function regionCells(id,src=cells){return src.flat().filter(c=>c.regionId===id)}"
          new_region="function regionCells(id,src=cells){return geometryFor(src).regions[id]}"
          if old_region not in s: raise SystemExit('regionCells marker not found')
          s=s.replace(old_region,new_region,1)

          old_unit="function unitCells(src,kind,index){if(kind==='row')return src[index];if(src===cells&&playGeometry)return kind==='col'?playGeometry.cols[index]:playGeometry.regions[index];if(kind==='col'){const out=new Array(N);for(let r=0;r<N;r++)out[r]=src[r][index];return out}const out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(src[r][c].regionId===index)out.push(src[r][c]);return out}"
          new_unit="function unitCells(src,kind,index){if(kind==='row')return src[index];const g=src===cells&&playGeometry?playGeometry:geometryFor(src);return kind==='col'?g.cols[index]:g.regions[index]}"
          if old_unit not in s: raise SystemExit('unitCells marker not found')
          s=s.replace(old_unit,new_unit,1)

          # Region edits invalidate both geometry and state caches.
          s=s.replace('touchState(cells);return true}function paintRegionCell', 'touchRegions(cells);return true}function paintRegionCell',1)
          # replace next region-paint invalidation occurrence only
          paint_marker="touchState(cells);updateCellVisual(r,c)}function validateRegions"
          if paint_marker not in s: raise SystemExit('paint invalidation marker not found')
          s=s.replace(paint_marker,"touchRegions(cells);updateCellVisual(r,c)}function validateRegions",1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: cache row column and region geometry'
          git push
