name: Split solver cost
on:
  push:
    paths:
      - '.github/workflows/split-solver-cost.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="function nextDeduction(src=cells){return direct(src)||proofDeduction(src)}"
          cheap="""function cheapDirect(src=cells){const bad=contradiction(src);if(bad)return{bad};for(const q of src.flat().filter(c=>c.state===2)){const affected=src.flat().filter(c=>c.state===0&&queenConflict(c,q));if(affected.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除 '+affected.length+' 格',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}for(const kind of['row','col','region'])for(let i=0;i<N;i++){const u=unitCells(src,kind,i);if(u.some(c=>c.state===2))continue;const cand=u.filter(c=>isCandidate(c,src));if(cand.length===1){const c=cand[0];return{label:unitLabel(kind,i)+' 只剩唯一候選 R'+(c.row+1)+'C'+(c.col+1),changes:[{row:c.row,col:c.col,newState:2}]}}}const cross=rowColumnRegionIntersectionDeduction(src);if(cross)return cross;for(let region=0;region<N;region++){const rc=unitCells(src,'region',region);if(rc.some(c=>c.state===2))continue;const cand=rc.filter(c=>isCandidate(c,src));if(cand.length<2)continue;const rows=[...new Set(cand.map(c=>c.row))];if(rows.length===1){const r=rows[0],affected=src[r].filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Row '+(r+1)+'，排除該列其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}const cols=[...new Set(cand.map(c=>c.col))];if(cols.length===1){const col=cols[0],affected=src.map(row=>row[col]).filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Column '+(col+1)+'，排除該欄其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}}for(const kind of['row','col'])for(let i=0;i<N;i++){const u=unitCells(src,kind,i);if(u.some(c=>c.state===2))continue;const cand=u.filter(c=>isCandidate(c,src));if(cand.length<2)continue;const regions=[...new Set(cand.map(c=>c.regionId))];if(regions.length!==1)continue;const region=regions[0],affected=unitCells(src,'region',region).filter(c=>isCandidate(c,src)&&(kind==='row'?c.row!==i:c.col!==i));if(affected.length)return{label:unitLabel(kind,i)+' 的候選全部位於 Region '+(region+1)+'，排除該色塊其他候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}return null}function nextDeduction(src=cells){return direct(src)||proofDeduction(src)}"""
          if marker not in s:
              raise SystemExit('nextDeduction marker not found')
          s=s.replace(marker,cheap,1)
          start=s.index('function autoUntilNextQueen()')
          end=s.index('function shuffled(',start)
          new_auto="""async function autoUntilNextQueen(){if(mode!=='play'){setStatus('請先進入推演模式。','bad');return}const before=cells.flat().filter(c=>c.state===2).length;if(before>=N){setStatus('已完成。','ok');return}const started=performance.now(),timeoutMs=5000;let operations=0;const limit=N*N*20;while(operations<limit){if(performance.now()-started>=timeoutMs){render();setStatus('已停止：自動推演超過 5 秒，尚未推出下一個皇后。可改用「推演一步」執行完整規則。','warn');return}const d=cheapDirect(cells);if(!d){render();setStatus('已停止：低成本推理目前無法再前進。可按「推演一步」使用 Hall 集合與反證等完整規則。','info');return}if(d.bad){setStatus('矛盾：'+d.bad,'bad');return}pushAction('自動推演：'+d.label,d.changes,'logic');operations++;if(cells.flat().filter(c=>c.state===2).length>before){render();setStatus('已用低成本推理推演到下一個皇后，共執行 '+operations+' 個確定操作。','info');return}if(operations%8===0)await new Promise(r=>setTimeout(r,0))}render();setStatus('已達單次推演安全上限。','warn')}"""
          s=s[:start]+new_auto+s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: split full and low-cost solver modes'
          git push
