name: Fix region cache invalidation
on:
  push:
    paths:
      - '.github/workflows/fix-region-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invalidate solver cache after region edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function removeColor(c){const old=c.regionId;if(old<0)return true;c.regionId=-1;if(!isRegionConnected(old)){c.regionId=old;setStatus('不能移除：會讓原色塊斷開。','bad');return false}return true}"
          new="function removeColor(c){const old=c.regionId;if(old<0)return true;c.regionId=-1;if(!isRegionConnected(old)){c.regionId=old;setStatus('不能移除：會讓原色塊斷開。','bad');return false}touchState(cells);return true}"
          if old not in s: raise SystemExit('removeColor marker not found')
          s=s.replace(old,new,1)
          old2="const old=x.regionId;x.regionId=selected;if(old>=0&&!isRegionConnected(old)){x.regionId=old;setStatus('不能改色：會讓原本色塊斷開。','bad');return}updateCellVisual(r,c)}"
          new2="const old=x.regionId;x.regionId=selected;if(old>=0&&!isRegionConnected(old)){x.regionId=old;setStatus('不能改色：會讓原本色塊斷開。','bad');return}touchState(cells);updateCellVisual(r,c)}"
          if old2 not in s: raise SystemExit('paintRegionCell marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: invalidate solver cache after region edits'
          git push
