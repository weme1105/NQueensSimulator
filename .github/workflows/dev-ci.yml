name: Build DEV Candidate

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV source
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test DEV
        run: npm test

      - name: Build DEV
        run: npm run build

      - name: Apply pointer fix to DEV build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          old = "}else dragPlayCell(hit.row,hit.col)});"
          new = "}else if(pointerMoved)dragPlayCell(hit.row,hit.col)});"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compose DEV artifact
        run: |
          rm -rf dev-site
          mkdir -p dev-site
          cp -R dist/. dev-site/
          cp favicon.svg dev-site/favicon.svg
          cp dev-site/index.html dev-site/base.html
          cp dev/index.html dev-site/index.html
          sed -i "s#fetch('../index.html'#fetch('base.html'#" dev-site/index.html
          if [ -f dev/changelog.html ]; then cp dev/changelog.html dev-site/changelog.html; fi
          printf 'DEV_BRANCH=develop\nDEV_SHA=%s\n' "$(git rev-parse HEAD)" > dev-site/dev-version.txt

      - name: Upload DEV artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-site
          path: dev-site
          retention-days: 7
