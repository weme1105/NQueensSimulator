name: Migrate UI Worker Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/typescript-worker
    paths:
      - '.github/workflows/migrate-ui-worker-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy UI
        run: python scripts/patch_legacy_bridge.py
      - name: Commit bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'refactor: route solver UI through worker bridge'
          git push
