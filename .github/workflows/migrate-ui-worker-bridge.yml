name: Migrate UI Worker Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/typescript-worker
    paths:
      - '.github/workflows/migrate-ui-worker-bridge.yml'
      - 'scripts/patch_legacy_bridge.py'
      - 'scripts/patch_async_validation.py'
      - 'scripts/patch_engine_pipeline.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy UI bridge
        run: python scripts/patch_legacy_bridge.py
      - name: Patch async validation
        run: python scripts/patch_async_validation.py
      - name: Patch solver pipeline
        run: python scripts/patch_engine_pipeline.py
      - name: Commit migrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/solver/engine.ts
          git diff --cached --quiet || git commit -m 'refactor: move validation and heavy solver work to worker'
          git push
