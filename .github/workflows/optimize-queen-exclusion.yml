name: Optimize queen exclusion
on:
  push:
    paths:
      - '.github/workflows/optimize-queen-exclusion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avoid full-board scans for queen exclusions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          marker="function unitLabel(kind,index){return(kind==='row'?'Row ':kind==='col'?'Column ':'Region ')+(index+1)}"
          helper=marker+"function exclusionByQueen(q,src=cells){const seen=new Uint8Array(N*N),out=[];function add(x){const key=x.row*N+x.col;if(x!==q&&x.state===0&&!seen[key]){seen[key]=1;out.push(x)}}for(const x of unitCells(src,'row',q.row))add(x);for(const x of unitCells(src,'col',q.col))add(x);for(const x of unitCells(src,'region',q.regionId))add(x);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const r=q.row+dr,c=q.col+dc;if(r>=0&&c>=0&&r<N&&c<N)add(src[r][c])}return out}"
          if marker not in s: raise SystemExit('unitLabel marker not found')
          s=s.replace(marker,helper,1)

          old="for(const q of src.flat().filter(c=>c.state===2)){const affected=src.flat().filter(c=>c.state===0&&queenConflict(c,q));if(affected.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除 '+affected.length+' 格',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}"
          new="for(const q of solverSnapshot(src).queens){const affected=exclusionByQueen(q,src);if(affected.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除 '+affected.length+' 格',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}"
          count=s.count(old)
          if count<2: raise SystemExit(f'expected duplicate queen exclusion blocks, got {count}')
          s=s.replace(old,new)

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: avoid full-board scans for queen exclusions'
          git push
