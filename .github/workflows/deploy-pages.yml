name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply legacy production pointer fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          old = "}else dragPlayCell(hit.row,hit.col)});"
          new = "}else if(pointerMoved)dragPlayCell(hit.row,hit.col)});"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compose production site
        run: |
          rm -rf site
          mkdir -p site
          cp -R dist/. site/
          cp favicon.svg site/favicon.svg
          cp site/index.html site/base.html
          cp dev/index.html site/index.html
          sed -i "s#fetch('../index.html'#fetch('base.html'#" site/index.html
          if [ -f changelog.html ]; then cp changelog.html site/changelog.html; fi

      - name: Mirror production into DEV path
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp -R dist/. site/dev/
          cp favicon.svg site/dev/favicon.svg
          cp site/dev/index.html site/dev/base.html
          cp dev/index.html site/dev/index.html
          sed -i "s#fetch('../index.html'#fetch('base.html'#" site/dev/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('site/dev/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<base href=\"../\">', '<base href=\"./\">')
          s = s.replace('<base href="../">', '<base href="./">')
          p.write_text(s, encoding='utf-8')
          PY
          if [ -f changelog.html ]; then cp changelog.html site/dev/changelog.html; fi
          printf 'DEV_BRANCH=main\nDEV_SHA=%s\n' "$(git rev-parse HEAD)" > site/dev/dev-version.txt

      - name: Write deployment manifest
        run: |
          SHA="$(git rev-parse HEAD)"
          printf 'PROD_BRANCH=main\nPROD_SHA=%s\nDEV_SOURCE=main\nDEV_SHA=%s\n' "$SHA" "$SHA" > site/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deployment1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail after three deployment attempts
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        run: |
          echo 'GitHub Pages deployment failed after 3 attempts.'
          exit 1
