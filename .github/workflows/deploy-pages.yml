name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional main commit SHA to deploy. Leave blank to deploy current main.'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching CI run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI result for ${COMMIT_SHA}"
          for attempt in $(seq 1 90); do
            RESPONSE="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&per_page=20")"
            RUN="$(printf '%s' "$RESPONSE" | jq -c '[.workflow_runs[] | select(.event == "push")] | first // empty')"
            if [ -z "$RUN" ]; then
              echo "CI run not visible yet (${attempt}/90)"
              sleep 10
              continue
            fi
            STATUS="$(printf '%s' "$RUN" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // ""')"
            URL="$(printf '%s' "$RUN" | jq -r '.html_url')"
            echo "CI: status=${STATUS} conclusion=${CONCLUSION} ${URL}"
            if [ "$STATUS" != "completed" ]; then
              sleep 10
              continue
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "CI gate rejected deployment: ${CONCLUSION}"
              exit 1
            fi
            echo "CI gate passed."
            exit 0
          done
          echo "Timed out waiting for matching CI run."
          exit 1

      - name: Manual deployment notice
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Manual deployment explicitly bypasses the automatic CI wait gate.'

  build-site:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Resolve PROD source ref
        id: prod
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BRANCH" = "main" ]; then
            REF="$PUSH_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BRANCH" = "develop" ]; then
            REF="main"
          elif [ -n "$TARGET_SHA" ]; then
            REF="$TARGET_SHA"
          else
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying PROD source ref: $REF"

      - name: Checkout PROD source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prod.outputs.ref }}
          path: prod-src

      - name: Verify PROD checkout
        env:
          EXPECTED_REF: ${{ steps.prod.outputs.ref }}
        run: |
          ACTUAL_SHA="$(git -C prod-src rev-parse HEAD)"
          echo "Resolved PROD SHA: $ACTUAL_SHA"
          if [ "$EXPECTED_REF" != "main" ]; then
            EXPECTED_SHA="$(git -C prod-src rev-parse "$EXPECTED_REF^{commit}")"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "PROD checkout mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi
          fi

      - name: Detect active develop branch
        id: dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/develop" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout DEV source from develop
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PROD build dependencies
        working-directory: prod-src
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build PROD
        working-directory: prod-src
        run: npm run build

      - name: Install DEV build dependencies
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm ci

      - name: Build DEV for /dev/
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run build:dev

      - name: Compose production site from main build
        run: |
          rm -rf site
          mkdir -p site
          cp -R prod-src/dist/. site/
          if [ -f prod-src/favicon.svg ]; then cp prod-src/favicon.svg site/favicon.svg; fi
          if [ -f prod-src/changelog.html ]; then cp prod-src/changelog.html site/changelog.html; fi

      - name: Compose DEV site from develop build
        if: steps.dev.outputs.exists == 'true'
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp -R dev-src/dist/. site/dev/
          if [ -f dev-src/favicon.svg ]; then cp dev-src/favicon.svg site/dev/favicon.svg; fi
          if [ -f dev-src/changelog.html ]; then cp dev-src/changelog.html site/dev/changelog.html; fi
          printf 'DEV_BRANCH=develop\nDEV_SHA=%s\n' "$(git -C dev-src rev-parse HEAD)" > site/dev/dev-version.txt

      - name: Mirror production into DEV path when develop is absent
        if: steps.dev.outputs.exists != 'true'
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp -R prod-src/dist/. site/dev/
          if [ -f prod-src/favicon.svg ]; then cp prod-src/favicon.svg site/dev/favicon.svg; fi
          printf 'DEV_BRANCH=main\nDEV_SHA=%s\n' "$(git -C prod-src rev-parse HEAD)" > site/dev/dev-version.txt

      - name: Write deployment manifest
        run: |
          PROD_SHA="$(git -C prod-src rev-parse HEAD)"
          if [ "${{ steps.dev.outputs.exists }}" = "true" ]; then
            DEV_SHA="$(git -C dev-src rev-parse HEAD)"
            DEV_SOURCE="develop"
          else
            DEV_SHA="$PROD_SHA"
            DEV_SOURCE="main"
          fi
          printf 'PROD_BRANCH=main\nPROD_SHA=%s\nDEV_SOURCE=%s\nDEV_SHA=%s\n' "$PROD_SHA" "$DEV_SOURCE" "$DEV_SHA" > site/deployment-version.txt
          cat site/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Publish Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deployment1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail after three deployment attempts
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        run: |
          echo 'GitHub Pages deployment failed after 3 attempts.'
          exit 1

  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify PROD and DEV endpoints
        env:
          ROOT_URL: https://weme1105.github.io/NQueensSimulator/
          DEV_URL: https://weme1105.github.io/NQueensSimulator/dev/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --retry 2 --retry-delay 2 "$ROOT_URL" >/tmp/prod.html \
              && curl -fsS --retry 2 --retry-delay 2 "$DEV_URL" >/tmp/dev.html \
              && curl -fsS --retry 2 --retry-delay 2 "${ROOT_URL}deployment-version.txt" >/tmp/version.txt; then
              grep -q '<div id="board"' /tmp/prod.html
              grep -q '<div id="board"' /tmp/dev.html
              grep -q '^PROD_SHA=' /tmp/version.txt
              grep -q '^DEV_SHA=' /tmp/version.txt
              echo 'Post-deploy smoke test passed.'
              cat /tmp/version.txt
              exit 0
            fi
            echo "Pages not ready yet (${attempt}/12); retrying..."
            sleep 10
          done
          echo 'Post-deploy smoke test failed.'
          exit 1
