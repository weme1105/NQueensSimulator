name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional main commit SHA to deploy. Leave blank to deploy current main.'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PROD source ref
        id: prod
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BRANCH" = "main" ]; then
            REF="$PUSH_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BRANCH" = "develop" ]; then
            REF="main"
          elif [ -n "$TARGET_SHA" ]; then
            REF="$TARGET_SHA"
          else
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying PROD source ref: $REF"

      - name: Checkout PROD source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prod.outputs.ref }}
          path: prod-src

      - name: Verify PROD checkout
        env:
          EXPECTED_REF: ${{ steps.prod.outputs.ref }}
        run: |
          ACTUAL_SHA="$(git -C prod-src rev-parse HEAD)"
          echo "Resolved PROD SHA: $ACTUAL_SHA"
          if [ "$EXPECTED_REF" != "main" ]; then
            EXPECTED_SHA="$(git -C prod-src rev-parse "$EXPECTED_REF^{commit}")"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "PROD checkout mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi
          fi

      - name: Detect active develop branch
        id: dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/develop" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout DEV source from develop
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PROD dependencies
        working-directory: prod-src
        run: npm install

      - name: Lint PROD when available
        working-directory: prod-src
        run: npm run lint --if-present

      - name: Typecheck PROD when available
        working-directory: prod-src
        run: npm run typecheck --if-present

      - name: Test PROD
        working-directory: prod-src
        run: npm test

      - name: Coverage PROD when available
        working-directory: prod-src
        run: npm run test:coverage --if-present

      - name: Audit PROD dependencies
        working-directory: prod-src
        run: npm audit --audit-level=high

      - name: Build PROD
        working-directory: prod-src
        run: npm run build

      - name: Install PROD Playwright browsers when available
        working-directory: prod-src
        run: |
          if npm pkg get scripts.e2e | grep -qv null; then
            npx playwright install --with-deps chromium webkit
          fi

      - name: E2E PROD when available
        working-directory: prod-src
        run: npm run e2e --if-present

      - name: Install DEV dependencies
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm install

      - name: Lint DEV
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run lint

      - name: Typecheck DEV
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run typecheck

      - name: Test DEV
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm test

      - name: Coverage DEV
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run test:coverage

      - name: Audit DEV dependencies
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run audit

      - name: Build DEV for /dev/
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run build:dev

      - name: Install DEV Playwright Chromium and WebKit
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npx playwright install --with-deps chromium webkit

      - name: E2E DEV
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev-src
        run: npm run e2e

      - name: Compose production site directly from main build
        run: |
          rm -rf site
          mkdir -p site
          cp -R prod-src/dist/. site/
          cp prod-src/favicon.svg site/favicon.svg
          if [ -f prod-src/changelog.html ]; then cp prod-src/changelog.html site/changelog.html; fi

      - name: Compose DEV site directly from develop build
        if: steps.dev.outputs.exists == 'true'
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp -R dev-src/dist/. site/dev/
          cp dev-src/favicon.svg site/dev/favicon.svg
          if [ -f dev-src/changelog.html ]; then cp dev-src/changelog.html site/dev/changelog.html; fi
          printf 'DEV_BRANCH=develop\nDEV_SHA=%s\n' "$(git -C dev-src rev-parse HEAD)" > site/dev/dev-version.txt

      - name: Mirror production into DEV path when develop is absent
        if: steps.dev.outputs.exists != 'true'
        run: |
          rm -rf site/dev
          mkdir -p site/dev
          cp -R prod-src/dist/. site/dev/
          cp prod-src/favicon.svg site/dev/favicon.svg
          printf 'DEV_BRANCH=main\nDEV_SHA=%s\n' "$(git -C prod-src rev-parse HEAD)" > site/dev/dev-version.txt

      - name: Write deployment manifest
        run: |
          PROD_SHA="$(git -C prod-src rev-parse HEAD)"
          if [ "${{ steps.dev.outputs.exists }}" = "true" ]; then
            DEV_SHA="$(git -C dev-src rev-parse HEAD)"
            DEV_SOURCE="develop"
          else
            DEV_SHA="$PROD_SHA"
            DEV_SOURCE="main"
          fi
          printf 'PROD_BRANCH=main\nPROD_SHA=%s\nDEV_SOURCE=%s\nDEV_SHA=%s\n' "$PROD_SHA" "$DEV_SOURCE" "$DEV_SHA" > site/deployment-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.deployment1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail after three deployment attempts
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        run: |
          echo 'GitHub Pages deployment failed after 3 attempts.'
          exit 1
