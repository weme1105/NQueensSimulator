name: Order solver by cost
on:
  push:
    paths:
      - '.github/workflows/order-solver-by-cost.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Order deductions from cheapest to most expensive
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Hall functions gain an exact/min size control so the caller can enforce global cost order.
          s=s.replace('function hallSubsetDeduction(src,kind,maxSize=5){','function hallSubsetDeduction(src,kind,maxSize=5,minSize=2){',1)
          s=s.replace('for(let k=2;k<=Math.min(maxSize,active.length);k++){','for(let k=minSize;k<=Math.min(maxSize,active.length);k++){',1)
          s=s.replace('function reverseHallRegionDeduction(src,kind,maxSize=5){','function reverseHallRegionDeduction(src,kind,maxSize=5,minSize=2){',1)
          # replace the second Hall loop only
          pos=s.index('function reverseHallRegionDeduction')
          tail=s[pos:]
          tail=tail.replace('for(let k=2;k<=Math.min(maxSize,active.length);k++){','for(let k=minSize;k<=Math.min(maxSize,active.length);k++){',1)
          s=s[:pos]+tail

          # cheapDirect becomes true base-cost only: no combinatorial Hall search.
          old="return hallSubsetDeduction(src,'row',3)||hallSubsetDeduction(src,'col',3)||reverseHallRegionDeduction(src,'row',3)||reverseHallRegionDeduction(src,'col',3)||null}function nextDeduction(src=cells){return direct(src)||proofDeduction(src)}"
          new="return null}function hallTier(src,size){return hallSubsetDeduction(src,'row',size,size)||hallSubsetDeduction(src,'col',size,size)||reverseHallRegionDeduction(src,'row',size,size)||reverseHallRegionDeduction(src,'col',size,size)||null}function nextDeduction(src=cells){let d=cheapDirect(src);if(d)return d;d=hallTier(src,2);if(d)return d;d=hallTier(src,3);if(d)return d;d=hallTier(src,4);if(d)return d;d=hallTier(src,5);if(d)return d;return proofDeduction(src)}"
          if old not in s: raise SystemExit('cheapDirect/nextDeduction marker not found')
          s=s.replace(old,new,1)

          # Auto solver also respects cost order: base -> Hall2 -> Hall3. Never Hall4/5/proof.
          start=s.index('async function autoUntilNextQueen()')
          end=s.index('function shuffled(',start)
          new_auto="""async function autoUntilNextQueen(){if(mode!=='play'){setStatus('請先進入推演模式。','bad');return}const before=cells.flat().filter(c=>c.state===2).length;if(before>=N){setStatus('已完成。','ok');return}const started=performance.now(),timeoutMs=5000;let operations=0;const limit=N*N*20;while(operations<limit){if(performance.now()-started>=timeoutMs){render();setStatus('已停止：自動推演超過 5 秒，尚未推出下一個皇后。可改用「推演一步」進入 Hall 4~5 / 反證。','warn');return}let d=cheapDirect(cells),tier='基本規則';if(!d){d=hallTier(cells,2);tier='Hall 2'}if(!d){d=hallTier(cells,3);tier='Hall 3'}if(!d){render();setStatus('已停止：基本規則、Hall 2、Hall 3 都沒有結果。可按「推演一步」繼續 Hall 4~5 / 反證。','info');return}if(d.bad){setStatus('矛盾：'+d.bad,'bad');return}pushAction('自動推演 ['+tier+']：'+d.label,d.changes,'logic');operations++;if(cells.flat().filter(c=>c.state===2).length>before){render();setStatus('已依成本順序推演到下一個皇后，共執行 '+operations+' 個確定操作；最後使用 '+tier+'。','info');return}if(operations%8===0)await new Promise(r=>setTimeout(r,0))}render();setStatus('已達單次推演安全上限。','warn')}"""
          s=s[:start]+new_auto+s[end:]

          # Make the behavior visible in the mode hint.
          s=s.replace('推演一步使用完整規則（Hall 2~5 + 反證）；自動推演使用低成本規則與 Hall 2~3，最多 5 秒。','推演依成本由低到高：基本規則 → Hall 2 → Hall 3 → Hall 4 → Hall 5 → 反證。自動推演只到 Hall 3，最多 5 秒；推演一步才會繼續 Hall 4~5 與反證。')

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: order deductions strictly by solver cost'
          git push
