name: Optimize cheap rules
on:
  push:
    paths:
      - '.github/workflows/optimize-cheap-rules.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use cached masks for low-cost deductions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          marker="function bitCount(x){let n=0;while(x){x&=x-1;n++}return n}"
          helper=marker+"function singleBitIndex(mask){return mask&&!(mask&(mask-1))?31-Math.clz32(mask):-1}function firstCandidateInUnit(src,kind,index){for(const c of unitCells(src,kind,index))if(isCandidate(c,src))return c;return null}"
          if marker not in s: raise SystemExit('bitCount marker not found')
          s=s.replace(marker,helper,1)

          start=s.index('function rowColumnRegionIntersectionDeduction(src)')
          end=s.index('function direct(',start)
          cross="""function rowColumnRegionIntersectionDeduction(src){const snap=solverSnapshot(src);for(let r=0;r<N;r++){if(snap.rowQueens[r])continue;const region=singleBitIndex(snap.rowRegionMask[r]);if(region<0)continue;for(let col=0;col<N;col++){if(snap.colQueens[col]||singleBitIndex(snap.colRegionMask[col])!==region)continue;const cross=src[r][col];if(cross.regionId===region&&isCandidate(cross,src))return{label:'Row '+(r+1)+' 與 Column '+(col+1)+' 的候選都被 Region '+(region+1)+' 完整包覆，因此交叉點 R'+(r+1)+'C'+(col+1)+' 必為皇后',changes:[{row:r,col:col,newState:2}]}}}return null}"""
          s=s[:start]+cross+s[end:]

          start=s.index('function cheapDirect(src=cells)')
          end=s.index('function hallTier(',start)
          cheap="""function cheapDirect(src=cells){const bad=contradiction(src);if(bad)return{bad};const snap=solverSnapshot(src);for(const q of snap.queens){const affected=exclusionByQueen(q,src);if(affected.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除 '+affected.length+' 格',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}for(let i=0;i<N;i++){if(!snap.rowQueens[i]&&snap.rowCandidates[i]===1){const c=firstCandidateInUnit(src,'row',i);if(c)return{label:unitLabel('row',i)+' 只剩唯一候選 R'+(c.row+1)+'C'+(c.col+1),changes:[{row:c.row,col:c.col,newState:2}]}}if(!snap.colQueens[i]&&snap.colCandidates[i]===1){const c=firstCandidateInUnit(src,'col',i);if(c)return{label:unitLabel('col',i)+' 只剩唯一候選 R'+(c.row+1)+'C'+(c.col+1),changes:[{row:c.row,col:c.col,newState:2}]}}if(!snap.regionQueens[i]&&snap.regionCandidates[i]===1){const c=firstCandidateInUnit(src,'region',i);if(c)return{label:unitLabel('region',i)+' 只剩唯一候選 R'+(c.row+1)+'C'+(c.col+1),changes:[{row:c.row,col:c.col,newState:2}]}}}const cross=rowColumnRegionIntersectionDeduction(src);if(cross)return cross;for(let region=0;region<N;region++){if(snap.regionQueens[region])continue;let r=singleBitIndex(snap.regionRowMask[region]);if(r>=0){const affected=src[r].filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Row '+(r+1)+'，排除該列其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}let col=singleBitIndex(snap.regionColMask[region]);if(col>=0){const affected=unitCells(src,'col',col).filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Column '+(col+1)+'，排除該欄其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}}for(let i=0;i<N;i++){if(!snap.rowQueens[i]){const region=singleBitIndex(snap.rowRegionMask[i]);if(region>=0){const affected=unitCells(src,'region',region).filter(c=>c.row!==i&&isCandidate(c,src));if(affected.length)return{label:'Row '+(i+1)+' 的候選全部位於 Region '+(region+1)+'，排除該色塊其他候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}}if(!snap.colQueens[i]){const region=singleBitIndex(snap.colRegionMask[i]);if(region>=0){const affected=unitCells(src,'region',region).filter(c=>c.col!==i&&isCandidate(c,src));if(affected.length)return{label:'Column '+(i+1)+' 的候選全部位於 Region '+(region+1)+'，排除該色塊其他候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}}}return null}"""
          s=s[:start]+cheap+s[end:]
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: use cached masks for low-cost deductions'
          git push
