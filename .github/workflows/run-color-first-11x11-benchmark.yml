name: Run Color-First 11x11 Benchmark

on:
  workflow_dispatch:
    inputs:
      target:
        description: Number of accepted 11x11 puzzles to generate
        required: true
        default: '10'
        type: string
      max_attempts:
        description: Maximum generation attempts
        required: true
        default: '200000'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_PER_SIZE: ${{ inputs.target }}
      SIZES: '11'
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate 11x11 benchmark bank
        run: |
          start=$(date +%s%3N)
          npx --yes tsx scripts/generateColorFirstBank.ts
          end=$(date +%s%3N)
          elapsed=$((end-start))
          echo "BENCHMARK_WALL_MS=$elapsed" | tee benchmark.env
          echo "BENCHMARK_WALL_SECONDS=$(awk -v ms=$elapsed 'BEGIN { printf \"%.3f\", ms/1000 }')" | tee -a benchmark.env
      - name: Publish benchmark summary
        if: always()
        run: |
          echo '## Color-First 11x11 Benchmark' >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark.env ]; then cat benchmark.env >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: color-first-11x11-benchmark
          path: |
            data/generated/basic/puzzle-bank-11.json
            benchmark.env
          if-no-files-found: warn
