name: CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'index.html'
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Unit test coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm run audit

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Browser E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Legacy JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          match=re.search(r'<script>(.*)</script>',s,re.S)
          if not match:
              raise SystemExit('inline legacy script not found')
          Path('/tmp/app.js').write_text(match.group(1))
          PY
          node --check /tmp/app.js

      - name: Legacy DOM smoke test
        run: |
          npm install --no-save jsdom@26
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('index.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,url:'https://example.test/'});
          const d=dom.window.document;
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          assert(d.querySelectorAll('.cell').length===64,'initial 8x8 board should have 64 cells');

          const n=d.getElementById('n');
          n.value='12';
          d.getElementById('new').click();
          assert(d.querySelectorAll('.cell').length===144,'12x12 board should have 144 cells');

          n.value='20';
          d.getElementById('new').click();
          assert(d.querySelectorAll('.cell').length===400,'20x20 manual board should have 400 cells');

          n.value='13';
          d.getElementById('random').click();
          assert(d.getElementById('status').textContent.includes('最大支援 12×12'),'random generator should reject N > 12');

          console.log('Legacy DOM smoke test passed');
          JS
