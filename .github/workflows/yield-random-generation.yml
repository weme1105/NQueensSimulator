name: Yield random generation
on:
  push:
    paths:
      - '.github/workflows/yield-random-generation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yield during random puzzle generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('function growUniqueRegions(solution){','async function growUniqueRegions(solution){',1)
          old='frontier.delete(key(r,c));addFrontierAround(r,c);left--}return work}'
          new="frontier.delete(key(r,c));addFrontierAround(r,c);left--;if(left%6===0)await new Promise(resolve=>setTimeout(resolve,0))}return work}"
          if old not in s: raise SystemExit('growUniqueRegions tail marker not found')
          s=s.replace(old,new,1)
          old_call='const work=growUniqueRegions(sol);if(work){'
          new_call='const work=await growUniqueRegions(sol);if(work){'
          if old_call not in s: raise SystemExit('growUniqueRegions call marker not found')
          s=s.replace(old_call,new_call,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/check.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: yield during random puzzle generation'
          git push
