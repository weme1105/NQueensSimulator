name: Optimize runtime cache
on:
  push:
    paths:
      - '.github/workflows/optimize-runtime-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add candidate cache and play geometry index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          old="let N=8,cells=[],hist=[],opCount=0,mode='edit',selected=0,secret=0,unlocked=false,pointerActive=false,pointerMoved=false,pointerStart=null,visited=new Set(),playDragMode='paintX';"
          new="let N=8,cells=[],hist=[],opCount=0,mode='edit',selected=0,secret=0,unlocked=false,pointerActive=false,pointerMoved=false,pointerStart=null,visited=new Set(),playDragMode='paintX',playGeometry=null;const stateVersion=new WeakMap(),solverSnapshotCache=new WeakMap();"
          if old not in s: raise SystemExit('globals marker not found')
          s=s.replace(old,new,1)

          marker="function setStatus(t,k=''){status.className='status'+(k?' '+k:'');status.textContent=t}"
          helpers="""function setStatus(t,k=''){status.className='status'+(k?' '+k:'');status.textContent=t}function touchState(src){stateVersion.set(src,(stateVersion.get(src)||0)+1);solverSnapshotCache.delete(src)}function buildPlayGeometry(){const cols=Array.from({length:N},()=>[]),regions=Array.from({length:N},()=>[]);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cell=cells[r][c];cols[c].push(cell);if(cell.regionId>=0)regions[cell.regionId].push(cell)}playGeometry={cols,regions}}function solverSnapshot(src=cells){const version=stateVersion.get(src)||0,cached=solverSnapshotCache.get(src);if(cached&&cached.version===version)return cached;const queens=[],rowQueens=new Uint8Array(N),colQueens=new Uint8Array(N),regionQueens=new Uint8Array(N);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];if(x.state===2){queens.push(x);rowQueens[r]++;colQueens[c]++;if(x.regionId>=0)regionQueens[x.regionId]++}}const candidate=new Uint8Array(N*N),rowCandidates=new Uint16Array(N),colCandidates=new Uint16Array(N),regionCandidates=new Uint16Array(N);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];if(x.state!==0||x.regionId<0||rowQueens[r]||colQueens[c]||regionQueens[x.regionId])continue;let adjacent=false;for(let dr=-1;dr<=1&&!adjacent;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N&&src[rr][cc].state===2){adjacent=true;break}}if(adjacent)continue;candidate[r*N+c]=1;rowCandidates[r]++;colCandidates[c]++;regionCandidates[x.regionId]++}const snap={version,queens,rowQueens,colQueens,regionQueens,candidate,rowCandidates,colCandidates,regionCandidates};solverSnapshotCache.set(src,snap);return snap}"""
          if marker not in s: raise SystemExit('setStatus marker not found')
          s=s.replace(marker,helpers,1)

          # Reset geometry when board/regions may change.
          s=s.replace("function build(){N=Math.max(4,Math.min(20,+$('n').value||8));$('n').value=N;makeEmpty();", "function build(){N=Math.max(4,Math.min(20,+$('n').value||8));$('n').value=N;playGeometry=null;makeEmpty();",1)
          s=s.replace("function enterPlay(){const p=puzzleStatus();if(!p.ok){setStatus(p.msg,'bad');return}mode='play';render();", "function enterPlay(){const p=puzzleStatus();if(!p.ok){setStatus(p.msg,'bad');return}mode='play';buildPlayGeometry();render();",1)
          s=s.replace("$('edit').onclick=()=>{secret=0;mode='edit';render()}", "$('edit').onclick=()=>{secret=0;mode='edit';playGeometry=null;render()}",1)
          s=s.replace("cells=work;hist=[];opCount=0;selected=0;mode='edit';render();", "cells=work;playGeometry=null;hist=[];opCount=0;selected=0;mode='edit';render();",1)

          # Fast unit lookup during play; simulations/edit mode fall back to direct construction.
          old_unit="function unitCells(src,kind,index){return kind==='row'?src[index]:kind==='col'?src.map(r=>r[index]):src.flat().filter(c=>c.regionId===index)}"
          new_unit="function unitCells(src,kind,index){if(kind==='row')return src[index];if(src===cells&&playGeometry)return kind==='col'?playGeometry.cols[index]:playGeometry.regions[index];if(kind==='col'){const out=new Array(N);for(let r=0;r<N;r++)out[r]=src[r][index];return out}const out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(src[r][c].regionId===index)out.push(src[r][c]);return out}"
          if old_unit not in s: raise SystemExit('unitCells marker not found')
          s=s.replace(old_unit,new_unit,1)

          # O(1) candidate lookup from snapshot instead of rescanning all queens per call.
          s,n=re.subn(r"function isCandidate\(c,src=cells\)\{.*?\}", "function isCandidate(c,src=cells){return c.state===0&&!!solverSnapshot(src).candidate[c.row*N+c.col]}", s, count=1)
          if n!=1: raise SystemExit('isCandidate replace failed')

          # Contradiction check now reuses precomputed queen/candidate counts.
          new_contra="""function contradiction(src=cells){const snap=solverSnapshot(src),qs=snap.queens;for(let i=0;i<N;i++){if(snap.rowQueens[i]>1)return unitLabel('row',i)+' 有多個皇后';if(snap.colQueens[i]>1)return unitLabel('col',i)+' 有多個皇后';if(snap.regionQueens[i]>1)return unitLabel('region',i)+' 有多個皇后';if(!snap.rowQueens[i]&&!snap.rowCandidates[i])return unitLabel('row',i)+' 沒有候選格';if(!snap.colQueens[i]&&!snap.colCandidates[i])return unitLabel('col',i)+' 沒有候選格';if(!snap.regionQueens[i]&&!snap.regionCandidates[i])return unitLabel('region',i)+' 沒有候選格'}for(const q of qs)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const r=q.row+dr,c=q.col+dc;if(r>=0&&c>=0&&r<N&&c<N&&src[r][c].state===2&&!(r===q.row&&c===q.col))return'皇后互相相鄰'}return null}"""
          s,n=re.subn(r"function contradiction\(src=cells\)\{.*?\}function isCandidate",new_contra+'function isCandidate',s,count=1)
          if n!=1: raise SystemExit('contradiction replace failed')

          # Hall candidate lambdas use the shared snapshot cache.
          s=s.replace("const queens=src.flat().filter(c=>c.state===2),candidate=c=>c.state===0&&!queens.some(q=>queenConflict(c,q));", "const candidate=c=>isCandidate(c,src);", 2)

          # Invalidate snapshot after state mutations.
          s=s.replace("hist.push(e);opCount++;validateQueens()", "hist.push(e);opCount++;touchState(cells);validateQueens()",1)
          s=s.replace("opCount=Math.max(0,opCount-1);validateQueens();render()", "opCount=Math.max(0,opCount-1);touchState(cells);validateQueens();render()",1)
          s=s.replace("hist=[];opCount=0;render()}function validateQueens", "hist=[];opCount=0;touchState(cells);render()}function validateQueens",1)
          s=s.replace("function applyToSim(src,d){for(const ch of d.changes||[])src[ch.row][ch.col].state=ch.newState}", "function applyToSim(src,d){let changed=false;for(const ch of d.changes||[]){if(src[ch.row][ch.col].state!==ch.newState){src[ch.row][ch.col].state=ch.newState;changed=true}}if(changed)touchState(src)}",1)

          # Manual direct simulation assignments in proof need invalidation before closure.
          s=s.replace("sim[c.row][c.col].state=2;const r=deterministicClosure(sim);", "sim[c.row][c.col].state=2;touchState(sim);const r=deterministicClosure(sim);",1)
          s=s.replace("sim[c.row][c.col].state=1;const r=deterministicClosure(sim);", "sim[c.row][c.col].state=1;touchState(sim);const r=deterministicClosure(sim);",1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/check.js').write_text(js)
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'perf: cache candidates and index play constraints'
          git push
