<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N 皇后推演</title><style>body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f1ed;margin:0;color:#5b4444}.app{max-width:1180px;margin:22px auto;padding:0 16px}.toolbar,.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px #00000012}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:9px 12px;border:1px solid #e6d9d2;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700}.primary{background:#aa6b6b;color:#fff!important}.active{outline:3px solid #444}.stats{margin-left:auto;display:flex;gap:14px}.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-top:18px}.board{display:grid;gap:3px;aspect-ratio:1/1}.cell{position:relative;border:0;border-radius:7px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}.cell.unassigned{background:#e9e4e1!important}.cell.conflict{outline:4px solid #e33;outline-offset:-4px}.cell.solved{transform:scale(1.10);z-index:5;box-shadow:0 0 0 4px #fff,0 8px 22px #0004}.mark{font-size:clamp(16px,2.2vw,30px);font-weight:bold;text-shadow:0 2px 3px #0005}.cell.solved .mark{font-size:clamp(30px,4vw,54px)}.step{position:absolute;right:4px;bottom:4px;background:#fffffff0;color:#543;padding:2px 6px;border-radius:999px;font-size:11px}.palette{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.colorBtn{width:46px;height:46px;padding:0;border:3px solid transparent;border-radius:12px;position:relative}.colorBtn.selected{border-color:#222;transform:scale(1.08)}.colorBtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;text-shadow:0 1px 3px #0009}.modeBox,.status{padding:10px 12px;border:1px solid #eaded8;border-radius:12px;line-height:1.5}.modeBox{background:#fff9f6;margin-bottom:10px}.status{margin-top:12px;background:#fff7e6}.ok{background:#eef9ef;border-color:#c8e4cb}.bad{background:#fff0f0;border-color:#efbcbc}.info{background:#eef5ff;border-color:#cadcf4}.small{font-size:13px;color:#806f6f;line-height:1.65}.history{max-height:630px;overflow:auto}.item{border:1px solid #eaded8;border-radius:10px;padding:8px;margin-bottom:7px;background:#fff9f6}.solver{display:none;margin:12px 0}.solver button{margin:3px}@media(max-width:850px){.main{grid-template-columns:1fr}.stats{margin-left:0}}</style></head><body><div class="app"><div class="toolbar"><span>N：</span><input id="n" type="number" min="4" max="16" value="8" style="width:70px"><button id="new" class="primary">建立空白棋盤</button><button id="edit">設定色塊</button><button id="play">推演模式</button><button id="undo">上一步</button><button id="clear">清空推演</button><div class="stats"><span>步數：<b id="steps">0</b></span><span>皇后：<b id="queens">0 / 8</b></span></div></div><div class="main"><section class="panel"><div id="mode" class="modeBox"></div><div id="palette" class="palette"></div><div id="board" class="board"></div><div id="status" class="status"></div></section><aside class="panel"><h3 style="margin-top:0">操作紀錄</h3><div id="solver" class="solver"><button id="logic">邏輯推演一步</button><button id="auto">自動邏輯推演</button><button id="proof">反證推演一步</button></div><div id="history" class="history">目前沒有操作。</div></aside></div></div><script>(()=>{'use strict';const COLORS=['#9cc7e8','#b97a56','#38a8bb','#ce6585','#d6a900','#7d68cf','#2f8f55','#85cf72','#ffd97d','#e983d3','#64c96d','#7bb2d8','#ed9e62','#a7a7e8','#65c2ad','#db7f95'];let N=8,cells=[],hist=[],step=0,mode='edit',selected=0,paint=false,editMoved=false,editStart=null,dragX=false,dragMoved=false,dragStart=null,visited=new Set(),secret=0,unlocked=false;const $=id=>document.getElementById(id),board=$('board'),palette=$('palette'),status=$('status'),history=$('history'),solver=$('solver');function setStatus(t,k=''){status.className='status'+(k?' '+k:'');status.textContent=t}function reg(id,src=cells){return src.flat().filter(c=>c.regionId===id)}function connected(id,src=cells){const g=reg(id,src);if(g.length<=1)return true;const all=new Set(g.map(c=>c.row+','+c.col)),seen=new Set(),q=[[g[0].row,g[0].col]];seen.add(q[0].join(','));while(q.length){const [r,c]=q.shift();for(const[d1,d2]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(r+d1)+','+(c+d2);if(all.has(k)&&!seen.has(k)){seen.add(k);q.push([r+d1,c+d2])}}}return seen.size===g.length}function build(){N=Math.max(4,Math.min(16,+$('n').value||8));$('n').value=N;cells=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>({row:r,col:c,regionId:-1,state:0,lastStep:null,conflict:false})));hist=[];step=0;selected=0;mode='edit';render();setStatus('空白棋盤已建立。請設定 '+N+' 個相連色塊。')}function canPaint(c,id){if(id<0||c.regionId===id||reg(id).length===0)return true;return[[1,0],[-1,0],[0,1],[0,-1]].some(([dr,dc])=>{const r=c.row+dr,k=c.col+dc;return r>=0&&k>=0&&r<N&&k<N&&cells[r][k].regionId===id})}function removeColor(c){const old=c.regionId;if(old<0)return true;c.regionId=-1;if(!connected(old)){c.regionId=old;setStatus('不能移除：會讓原色塊斷開。','bad');return false}return true}function paintCell(r,c,toggle=false){const x=cells[r][c];if(selected===-1){if(removeColor(x)){render();liveCheck()}return}if(toggle&&x.regionId===selected){if(removeColor(x)){render();liveCheck()}return}if(x.regionId===selected)return;if(!canPaint(x,selected)){setStatus('同一顏色必須上下左右相連。','bad');return}const old=x.regionId;x.regionId=selected;if(old>=0&&!connected(old)){x.regionId=old;setStatus('不能改色：會讓原色塊斷開。','bad');return}render();liveCheck()}function validateRegions(){const empty=cells.flat().filter(c=>c.regionId<0).length;if(empty)return{ok:false,msg:'還有 '+empty+' 格尚未設定顏色。'};for(let i=0;i<N;i++){if(!reg(i).length)return{ok:false,msg:'色塊 '+(i+1)+' 尚未使用。'};if(!connected(i))return{ok:false,msg:'色塊 '+(i+1)+' 不相連。'}}return{ok:true}}function queenConflict(a,b){return a.row===b.row||a.col===b.col||a.regionId===b.regionId||(Math.abs(a.row-b.row)<=1&&Math.abs(a.col-b.col)<=1)}function findSolution(){const usedC=new Set(),usedR=new Set(),placed=[];function dfs(r){if(r===N)return placed.slice();for(const c of cells[r]){if(usedC.has(c.col)||usedR.has(c.regionId))continue;if(placed.some(q=>Math.abs(q.row-c.row)<=1&&Math.abs(q.col-c.col)<=1))continue;usedC.add(c.col);usedR.add(c.regionId);placed.push(c);const x=dfs(r+1);if(x)return x;placed.pop();usedC.delete(c.col);usedR.delete(c.regionId)}return null}return dfs(0)}function solvable(){const b=validateRegions();if(!b.ok)return b;return findSolution()?{ok:true,msg:'題目驗證通過：至少存在一組完整解。'}:{ok:false,msg:'此色塊配置無解，請調整色塊。'}}function liveCheck(){const empty=cells.flat().filter(c=>c.regionId<0).length;if(empty){setStatus('色塊設定中：還有 '+empty+' 格尚未分配顏色。');return}const x=solvable();setStatus((x.ok?'✓ ':'✗ ')+x.msg,x.ok?'ok':'bad')}function enterPlay(){const x=solvable();if(!x.ok){setStatus(x.msg,'bad');return}mode='play';render();setStatus(x.msg,'ok')}function apply(label,changes,type='manual'){if(!changes.length)return;step++;const e={step,label,type,changes:[]};for(const ch of changes){const c=cells[ch.row][ch.col];e.changes.push({row:ch.row,col:ch.col,state:c.state,lastStep:c.lastStep});c.state=ch.newState;c.lastStep=step}hist.push(e);validateQueens();render()}function playCell(r,c){const x=cells[r][c];apply('手動：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:(x.state+1)%3}])}function paintX(r,c){const k=r+','+c;if(visited.has(k))return;visited.add(k);if(cells[r][c].state===0)apply('畫 X：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:1}])}function undo(){const e=hist.pop();if(!e)return;for(let i=e.changes.length-1;i>=0;i--){const ch=e.changes[i],c=cells[ch.row][ch.col];c.state=ch.state;c.lastStep=ch.lastStep}step=hist.length?hist[hist.length-1].step:0;validateQueens();render()}function clear(){cells.flat().forEach(c=>{c.state=0;c.lastStep=null;c.conflict=false});hist=[];step=0;render()}function validateQueens(){cells.flat().forEach(c=>c.conflict=false);const q=cells.flat().filter(c=>c.state===2);for(let i=0;i<q.length;i++)for(let j=i+1;j<q.length;j++)if(queenConflict(q[i],q[j]))q[i].conflict=q[j].conflict=true}function contradiction(src=cells){const q=src.flat().filter(c=>c.state===2);for(let i=0;i<q.length;i++)for(let j=i+1;j<q.length;j++)if(queenConflict(q[i],q[j]))return'皇后互相衝突';for(const kind of['row','col','region'])for(let i=0;i<N;i++){const u=kind==='row'?src[i]:kind==='col'?src.map(r=>r[i]):src.flat().filter(c=>c.regionId===i);if(u.filter(c=>c.state===2).length>1)return kind+' '+(i+1)+' 有多個皇后';const p=u.filter(c=>c.state===2||(c.state===0&&!q.some(x=>x!==c&&queenConflict(c,x))));if(!p.length)return kind+' '+(i+1)+' 沒有候選格'}return null}function direct(src=cells){const bad=contradiction(src);if(bad)return{bad};for(const q of src.flat().filter(c=>c.state===2)){const a=src.flat().filter(c=>c.state===0&&queenConflict(c,q));if(a.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除衝突格',changes:a.map(c=>({row:c.row,col:c.col,newState:1}))}}for(const kind of['row','col','region'])for(let i=0;i<N;i++){const u=kind==='row'?src[i]:kind==='col'?src.map(r=>r[i]):src.flat().filter(c=>c.regionId===i);if(u.some(c=>c.state===2))continue;const q=src.flat().filter(c=>c.state===2),a=u.filter(c=>c.state===0&&!q.some(x=>queenConflict(c,x)));if(a.length===1){const c=a[0];return{label:kind+' '+(i+1)+' 只剩唯一候選',changes:[{row:c.row,col:c.col,newState:2}]}}}return null}function logic(){const d=direct();if(!d){setStatus('目前沒有可確定的直接推理。','info');return}if(d.bad){setStatus('矛盾：'+d.bad,'bad');return}apply('邏輯：'+d.label,d.changes,'logic')}function auto(){let n=0,d;while((d=direct())&&n<N*N*5){if(d.bad){setStatus('矛盾：'+d.bad,'bad');return}apply('邏輯：'+d.label,d.changes,'logic');n++}setStatus('自動邏輯推演完成，共 '+n+' 步。','info')}function proof(){if(direct()){setStatus('目前仍有直接推理可做。','info');return}const candidates=cells.flat().filter(c=>c.state===0);for(const c of candidates){const sim=cells.map(r=>r.map(x=>({...x})));sim[c.row][c.col].state=2;let guard=0,d;while((d=direct(sim))&&guard++<N*N*5){if(d.bad){apply('反證：R'+(c.row+1)+'C'+(c.col+1)+' 不可能是皇后',[{row:c.row,col:c.col,newState:1}],'proof');return}for(const ch of d.changes)sim[ch.row][ch.col].state=ch.newState}if(contradiction(sim)){apply('反證：R'+(c.row+1)+'C'+(c.col+1)+' 不可能是皇后',[{row:c.row,col:c.col,newState:1}],'proof');return}}setStatus('目前找不到可證明的反證結論。','info')}function renderPalette(){palette.innerHTML='';for(let i=0;i<N;i++){const b=document.createElement('button');b.className='colorBtn'+(i===selected?' selected':'');b.style.background=COLORS[i%COLORS.length];b.innerHTML='<span>'+(i+1)+'</span>';b.onclick=()=>{secret=0;selected=i;renderPalette()};palette.appendChild(b)}const e=document.createElement('button');e.className='colorBtn'+(selected===-1?' selected':'');e.style.background='#eee';e.innerHTML='<span style="color:#555;text-shadow:none">⌫</span>';e.onclick=()=>{secret=0;selected=-1;renderPalette()};palette.appendChild(e)}function solved(){return cells.flat().filter(c=>c.state===2).length===N&&!contradiction()}function renderBoard(){board.innerHTML='';board.style.gridTemplateColumns='repeat('+N+',1fr)';const done=solved();for(const c of cells.flat()){const b=document.createElement('button');b.className='cell'+(c.regionId<0?' unassigned':'')+(c.conflict?' conflict':'')+(done&&c.state===2?' solved':'');if(c.regionId>=0)b.style.background=COLORS[c.regionId%COLORS.length];b.innerHTML='<span class="mark">'+(c.state===1?'✕':c.state===2?'👑':'')+'</span>'+(c.lastStep!=null?'<span class="step">'+c.lastStep+'</span>':'');b.onmousedown=e=>{if(e.button!==0)return;secret=0;if(mode==='edit'){e.preventDefault();paint=true;editMoved=false;editStart={row:c.row,col:c.col,original:c.regionId};paintCell(c.row,c.col,false)}else{e.preventDefault();dragX=true;dragMoved=false;visited=new Set();dragStart={row:c.row,col:c.col,original:c.state};paintX(c.row,c.col)}};b.onmouseenter=()=>{if(mode==='edit'&&paint){editMoved=true;paintCell(c.row,c.col,false)}else if(mode==='play'&&dragX){dragMoved=true;paintX(c.row,c.col)}};b.onclick=e=>{e.preventDefault();if(mode==='edit'){if(!editMoved&&editStart&&editStart.original===selected)paintCell(c.row,c.col,true)}else if(!dragMoved&&dragStart&&dragStart.original!==0)playCell(c.row,c.col)};board.appendChild(b)}}function renderHistory(){history.innerHTML=hist.length?'':'目前沒有操作。';[...hist].reverse().forEach(h=>{const d=document.createElement('div');d.className='item';d.textContent='#'+h.step+' '+h.label;history.appendChild(d)})}function render(){renderPalette();renderBoard();renderHistory();$('steps').textContent=step;$('queens').textContent=cells.flat().filter(c=>c.state===2).length+' / '+N;$('edit').classList.toggle('active',mode==='edit');$('play').classList.toggle('active',mode==='play');palette.style.display=mode==='edit'?'flex':'none';$('mode').innerHTML=mode==='edit'?'<b>色塊設定模式</b>：N 種顏色 + 1 個橡皮擦；同色必須相連。':'<b>推演模式</b>：單點空白→X→👑→空白；按住拖曳可連續畫 X。';if(unlocked)solver.style.display='block';if(mode==='play'&&solved())setStatus('完成！','ok')}document.onmouseup=()=>{paint=false;dragX=false;setTimeout(()=>{editStart=null;dragStart=null;editMoved=false;dragMoved=false},0)};$('new').onclick=()=>{secret++;if(secret>=7){unlocked=true;solver.style.display='block'}build();if(unlocked)solver.style.display='block'};$('edit').onclick=()=>{secret=0;mode='edit';render()};$('play').onclick=()=>{secret=0;enterPlay()};$('undo').onclick=()=>{secret=0;undo()};$('clear').onclick=()=>{secret=0;clear()};$('logic').onclick=logic;$('auto').onclick=auto;$('proof').onclick=proof;build()})();</script></body></html>
