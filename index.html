<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N 皇后推演</title><style>*{box-sizing:border-box}body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f6f1ed;margin:0;color:#5b4444}.app{max-width:1180px;margin:22px auto;padding:0 16px}.toolbar,.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px #00000012}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:9px 12px;border:1px solid #e6d9d2;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700}.primary{background:#aa6b6b;color:#fff!important}.active{outline:3px solid #444}.stats{margin-left:auto;display:flex;gap:14px}.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-top:18px}.board{display:grid;gap:3px;width:100%;aspect-ratio:1/1;touch-action:none;user-select:none;-webkit-user-select:none}.cell{position:relative;border:0;border-radius:7px;padding:0;display:block;color:#fff;min-width:0;min-height:0;width:100%;height:100%}.cell.unassigned{background:#e9e4e1!important}.cell.conflict{outline:4px solid #e33;outline-offset:-4px}.cell.solved{z-index:5;box-shadow:0 0 0 4px #fff,0 8px 22px #0004}.mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.2vw,30px);font-weight:bold;text-shadow:0 2px 3px #0005;line-height:1;pointer-events:none}.cell.solved .mark{font-size:clamp(30px,4vw,54px);transform:scale(1.18)}.palette{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.colorBtn{width:46px;height:46px;padding:0;border:3px solid transparent;border-radius:12px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.colorBtn.selected{border-color:#222;transform:scale(1.08)}.colorBtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;text-shadow:0 1px 3px #0009}.modeBox,.status{padding:10px 12px;border:1px solid #eaded8;border-radius:12px;line-height:1.5}.modeBox{background:#fff9f6;margin-bottom:10px}.status{margin-top:12px;background:#fff7e6}.ok{background:#eef9ef;border-color:#c8e4cb}.bad{background:#fff0f0;border-color:#efbcbc}.info{background:#eef5ff;border-color:#cadcf4}.warn{background:#fff7e6;border-color:#ead8aa}.history{max-height:630px;overflow:auto}.item{border:1px solid #eaded8;border-radius:10px;padding:8px;margin-bottom:7px;background:#fff9f6}.solver{display:none;margin:12px 0}.solver button{margin:3px}@media(max-width:850px){.main{grid-template-columns:1fr}.stats{margin-left:0}.app{padding:0 8px}.toolbar,.panel{padding:12px}}</style></head><body><div class="app"><div class="toolbar"><span>N：</span><input id="n" type="number" min="4" max="20" value="8" style="width:70px"><button id="new" class="primary">建立空白棋盤</button><button id="random">隨機唯一題目</button><button id="edit">設定色塊</button><button id="play">推演模式</button><button id="undo">上一步</button><button id="clear">清空推演</button><div class="stats"><span>操作：<b id="steps">0</b></span><span>皇后：<b id="queens">0 / 8</b></span></div></div><div class="main"><section class="panel"><div id="mode" class="modeBox"></div><div id="palette" class="palette"></div><div id="board" class="board"></div><div id="status" class="status"></div></section><aside class="panel"><h3 style="margin-top:0">操作紀錄</h3><div id="solver" class="solver"><button id="stepSolve">推演一步</button><button id="autoQueen">自動推演到下一個皇后</button></div><div id="history" class="history">目前沒有操作。</div></aside></div></div><script>(()=>{'use strict';const COLORS=['#9cc7e8','#b97a56','#38a8bb','#ce6585','#d6a900','#7d68cf','#2f8f55','#85cf72','#ffd97d','#e983d3','#64c96d','#7bb2d8','#ef8a62','#9b8ad6','#5bb7a7','#d77c94','#6f9fd8','#a7c957','#f2a65a','#8d99ae'];const $=id=>document.getElementById(id),board=$('board'),palette=$('palette'),status=$('status'),historyEl=$('history'),solver=$('solver');let N=8,cells=[],hist=[],opCount=0,mode='edit',selected=0,secret=0,unlocked=false,pointerActive=false,pointerMoved=false,pointerStart=null,visited=new Set(),playDragMode='paintX',playGeometry=null,dragHistoryChanges=[];const stateVersion=new WeakMap(),solverSnapshotCache=new WeakMap(),geometryCache=new WeakMap();function setStatus(t,k=''){status.className='status'+(k?' '+k:'');status.textContent=t}function touchState(src){stateVersion.set(src,(stateVersion.get(src)||0)+1);solverSnapshotCache.delete(src)}function touchRegions(src){geometryCache.delete(src);if(src===cells)playGeometry=null;touchState(src)}function geometryFor(src=cells){const cached=geometryCache.get(src);if(cached)return cached;const cols=Array.from({length:N},()=>[]),regions=Array.from({length:N},()=>[]);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];cols[c].push(x);if(x.regionId>=0)regions[x.regionId].push(x)}const g={cols,regions};geometryCache.set(src,g);return g}function buildPlayGeometry(){playGeometry=geometryFor(cells)}function solverSnapshot(src=cells){const version=stateVersion.get(src)||0,cached=solverSnapshotCache.get(src);if(cached&&cached.version===version)return cached;const queens=[],rowQueens=new Uint8Array(N),colQueens=new Uint8Array(N),regionQueens=new Uint8Array(N);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];if(x.state===2){queens.push(x);rowQueens[r]++;colQueens[c]++;if(x.regionId>=0)regionQueens[x.regionId]++}}const candidate=new Uint8Array(N*N),rowCandidates=new Uint16Array(N),colCandidates=new Uint16Array(N),regionCandidates=new Uint16Array(N),rowRegionMask=new Uint32Array(N),colRegionMask=new Uint32Array(N),regionRowMask=new Uint32Array(N),regionColMask=new Uint32Array(N);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=src[r][c];if(x.state!==0||x.regionId<0||rowQueens[r]||colQueens[c]||regionQueens[x.regionId])continue;let adjacent=false;for(let dr=-1;dr<=1&&!adjacent;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N&&src[rr][cc].state===2){adjacent=true;break}}if(adjacent)continue;candidate[r*N+c]=1;rowCandidates[r]++;colCandidates[c]++;regionCandidates[x.regionId]++;rowRegionMask[r]|=1<<x.regionId;colRegionMask[c]|=1<<x.regionId;regionRowMask[x.regionId]|=1<<r;regionColMask[x.regionId]|=1<<c}const snap={version,queens,rowQueens,colQueens,regionQueens,candidate,rowCandidates,colCandidates,regionCandidates,rowRegionMask,colRegionMask,regionRowMask,regionColMask};solverSnapshotCache.set(src,snap);return snap}function makeEmpty(){cells=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>({row:r,col:c,regionId:-1,state:0,conflict:false})))}function build(){N=Math.max(4,Math.min(20,+$('n').value||8));$('n').value=N;playGeometry=null;makeEmpty();hist=[];opCount=0;selected=0;mode='edit';render();setStatus('空白棋盤已建立。請設定 '+N+' 個相連色塊（手動最大 20×20）。')}function regionCells(id,src=cells){return geometryFor(src).regions[id]}function isRegionConnected(id,src=cells){const g=regionCells(id,src);if(g.length<=1)return true;const all=new Set(g.map(c=>c.row+','+c.col)),seen=new Set(),q=[[g[0].row,g[0].col]];seen.add(q[0].join(','));while(q.length){const[r,c]=q.shift();for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(r+dr)+','+(c+dc);if(all.has(k)&&!seen.has(k)){seen.add(k);q.push([r+dr,c+dc])}}}return seen.size===g.length}function canPaint(c,id){if(id<0||c.regionId===id||regionCells(id).length===0)return true;return[[1,0],[-1,0],[0,1],[0,-1]].some(([dr,dc])=>{const r=c.row+dr,k=c.col+dc;return r>=0&&k>=0&&r<N&&k<N&&cells[r][k].regionId===id})}function removeColor(c){const old=c.regionId;if(old<0)return true;c.regionId=-1;if(!isRegionConnected(old)){c.regionId=old;setStatus('不能移除：會讓原色塊斷開。','bad');return false}touchRegions(cells);return true}function paintRegionCell(r,c,toggle=false){const x=cells[r][c];if(selected===-1){if(removeColor(x))updateCellVisual(r,c);return}if(toggle&&x.regionId===selected){if(removeColor(x))updateCellVisual(r,c);return}if(x.regionId===selected)return;if(!canPaint(x,selected)){setStatus('同一顏色必須上下左右相連。','bad');return}const old=x.regionId;x.regionId=selected;if(old>=0&&!isRegionConnected(old)){x.regionId=old;setStatus('不能改色：會讓原本色塊斷開。','bad');return}touchRegions(cells);updateCellVisual(r,c)}function validateRegions(src=cells){const empty=src.flat().filter(c=>c.regionId<0).length;if(empty)return{ok:false,msg:'還有 '+empty+' 格尚未設定顏色。'};for(let i=0;i<N;i++){if(!regionCells(i,src).length)return{ok:false,msg:'色塊 '+(i+1)+' 尚未使用。'};if(!isRegionConnected(i,src))return{ok:false,msg:'色塊 '+(i+1)+' 不相連。'}}return{ok:true}}function queenConflict(a,b){return a.row===b.row||a.col===b.col||a.regionId===b.regionId||(Math.abs(a.row-b.row)<=1&&Math.abs(a.col-b.col)<=1)}function countSolutionsOn(src,limit=2,allowUnassigned=false){if(!allowUnassigned){const b=validateRegions(src);if(!b.ok)return{count:0,basicError:b.msg}}let count=0,firstSolution=null;const placedCols=new Int16Array(N);placedCols.fill(-1);let usedColsMask=0,usedRegionsMask=0;const assigned=new Uint8Array(N),g=geometryFor(src);function validCell(c){if(c.regionId<0||assigned[c.row])return false;const cb=1<<c.col,rb=1<<c.regionId;if(usedColsMask&cb||usedRegionsMask&rb)return false;const r=c.row;if(r>0&&placedCols[r-1]>=0&&Math.abs(placedCols[r-1]-c.col)<=1)return false;if(r+1<N&&placedCols[r+1]>=0&&Math.abs(placedCols[r+1]-c.col)<=1)return false;return true}function chooseBestUnit(){const rowCount=new Uint8Array(N),colCount=new Uint8Array(N),regionCount=new Uint8Array(N);for(let r=0;r<N;r++)for(const c of src[r])if(validCell(c)){rowCount[r]++;colCount[c.col]++;regionCount[c.regionId]++}let best=null,bestCount=N+1;for(let i=0;i<N;i++){if(!assigned[i]){const n=rowCount[i];if(!n)return{dead:true};if(n<bestCount){best={kind:'row',index:i,count:n};bestCount=n}}if(!(usedColsMask&(1<<i))){const n=colCount[i];if(!n)return{dead:true};if(n<bestCount){best={kind:'col',index:i,count:n};bestCount=n}}if(!(usedRegionsMask&(1<<i))){const n=regionCount[i];if(!n)return{dead:true};if(n<bestCount){best={kind:'region',index:i,count:n};bestCount=n}}}return best}function candidatesForUnit(unit){const source=unit.kind==='row'?src[unit.index]:unit.kind==='col'?g.cols[unit.index]:g.regions[unit.index],out=[];for(const c of source)if(validCell(c))out.push(c);return out}function dfs(depth){if(count>=limit)return;if(depth===N){count++;if(!firstSolution)firstSolution=Array.from({length:N},(_,r)=>({row:r,col:placedCols[r]}));return}const unit=chooseBestUnit();if(!unit||unit.dead)return;const cand=candidatesForUnit(unit);for(const c of cand){const cb=1<<c.col,rb=1<<c.regionId,r=c.row;assigned[r]=1;placedCols[r]=c.col;usedColsMask|=cb;usedRegionsMask|=rb;dfs(depth+1);usedRegionsMask&=~rb;usedColsMask&=~cb;placedCols[r]=-1;assigned[r]=0;if(count>=limit)break}}dfs(0);return{count,firstSolution}}function countSolutions(limit=2){return countSolutionsOn(cells,limit,false)}function puzzleStatus(){const b=validateRegions();if(!b.ok)return{ok:false,type:'incomplete',msg:b.msg};const r=countSolutions(2);if(r.count===0)return{ok:false,type:'none',msg:'此色塊配置無解，請調整色塊。'};if(r.count===1)return{ok:true,type:'unique',msg:'題目驗證通過：唯一解。'};return{ok:true,type:'multiple',msg:'題目可解，但存在多組解，不是唯一解。'}}function liveCheck(){const empty=cells.flat().filter(c=>c.regionId<0).length;if(empty){setStatus('色塊設定中：還有 '+empty+' 格尚未分配顏色。');return}const p=puzzleStatus();setStatus((p.type==='unique'?'✓ ':p.type==='multiple'?'△ ':'✗ ')+p.msg,p.type==='unique'?'ok':p.type==='multiple'?'warn':'bad')}function enterPlay(){const p=puzzleStatus();if(!p.ok){setStatus(p.msg,'bad');return}mode='play';buildPlayGeometry();render();setStatus(p.msg,p.type==='unique'?'ok':'warn')}function pushAction(label,changes,type='manual'){if(!changes.length)return;const e={label,type,changes:[]};for(const ch of changes){const c=cells[ch.row][ch.col];if(c.state===ch.newState)continue;e.changes.push({row:ch.row,col:ch.col,state:c.state});c.state=ch.newState}if(!e.changes.length)return;hist.push(e);opCount++;touchState(cells);validateQueens()}function cycleCell(r,c){const x=cells[r][c];pushAction('手動：R'+(r+1)+'C'+(c+1),[{row:r,col:c,newState:(x.state+1)%3}]);render()}function dragPlayCell(r,c){const key=r+','+c;if(visited.has(key))return;visited.add(key);const x=cells[r][c],next=playDragMode==='eraseX'?0:1;if(playDragMode==='eraseX'){if(x.state!==1)return}else if(x.state!==0)return;dragHistoryChanges.push({row:r,col:c,state:x.state});x.state=next;touchState(cells);updateCellVisual(r,c)}function commitDragHistory(){if(!dragHistoryChanges.length)return;hist.push({label:(playDragMode==='eraseX'?'拖曳清除 X':'拖曳畫 X')+'：'+dragHistoryChanges.length+' 格',type:'manual',changes:dragHistoryChanges.slice()});opCount++;dragHistoryChanges=[];validateQueens()}function undo(){const e=hist.pop();if(!e)return;for(let i=e.changes.length-1;i>=0;i--){const ch=e.changes[i];cells[ch.row][ch.col].state=ch.state}opCount=Math.max(0,opCount-1);touchState(cells);validateQueens();render()}function clearPlay(){cells.flat().forEach(c=>{c.state=0;c.conflict=false});hist=[];opCount=0;touchState(cells);render()}function validateQueens(){cells.flat().forEach(c=>c.conflict=false);const qs=cells.flat().filter(c=>c.state===2);for(let i=0;i<qs.length;i++)for(let j=i+1;j<qs.length;j++)if(queenConflict(qs[i],qs[j]))qs[i].conflict=qs[j].conflict=true}function unitCells(src,kind,index){if(kind==='row')return src[index];const g=src===cells&&playGeometry?playGeometry:geometryFor(src);return kind==='col'?g.cols[index]:g.regions[index]}function unitLabel(kind,index){return(kind==='row'?'Row ':kind==='col'?'Column ':'Region ')+(index+1)}function exclusionByQueen(q,src=cells){const seen=new Uint8Array(N*N),out=[];function add(x){const key=x.row*N+x.col;if(x!==q&&x.state===0&&!seen[key]){seen[key]=1;out.push(x)}}for(const x of unitCells(src,'row',q.row))add(x);for(const x of unitCells(src,'col',q.col))add(x);for(const x of unitCells(src,'region',q.regionId))add(x);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const r=q.row+dr,c=q.col+dc;if(r>=0&&c>=0&&r<N&&c<N)add(src[r][c])}return out}function contradiction(src=cells){const snap=solverSnapshot(src),qs=snap.queens;for(let i=0;i<N;i++){if(snap.rowQueens[i]>1)return unitLabel('row',i)+' 有多個皇后';if(snap.colQueens[i]>1)return unitLabel('col',i)+' 有多個皇后';if(snap.regionQueens[i]>1)return unitLabel('region',i)+' 有多個皇后';if(!snap.rowQueens[i]&&!snap.rowCandidates[i])return unitLabel('row',i)+' 沒有候選格';if(!snap.colQueens[i]&&!snap.colCandidates[i])return unitLabel('col',i)+' 沒有候選格';if(!snap.regionQueens[i]&&!snap.regionCandidates[i])return unitLabel('region',i)+' 沒有候選格'}for(const q of qs)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const r=q.row+dr,c=q.col+dc;if(r>=0&&c>=0&&r<N&&c<N&&src[r][c].state===2&&!(r===q.row&&c===q.col))return'皇后互相相鄰'}return null}function isCandidate(c,src=cells){return c.state===0&&!!solverSnapshot(src).candidate[c.row*N+c.col]}function bitCount(x){let n=0;while(x){x&=x-1;n++}return n}function singleBitIndex(mask){return mask&&!(mask&(mask-1))?31-Math.clz32(mask):-1}function firstCandidateInUnit(src,kind,index){for(const c of unitCells(src,kind,index))if(isCandidate(c,src))return c;return null}function eachCombination(items,k,visit){const pick=[];function go(start,left){if(left===0)return visit(pick)===true;for(let i=start;i<=items.length-left;i++){pick.push(items[i]);if(go(i+1,left-1))return true;pick.pop()}return false}return go(0,k)}function hallSubsetDeduction(src,kind,maxSize=5,minSize=2){const snap=solverSnapshot(src),active=[];for(let i=0;i<N;i++)if(!(kind==='row'?snap.rowQueens[i]:snap.colQueens[i]))active.push(i);if(active.length<2)return null;const candidate=c=>isCandidate(c,src),masks=kind==='row'?snap.rowRegionMask:snap.colRegionMask;let found=null;for(let k=minSize;k<=Math.min(maxSize,active.length);k++){const stop=eachCombination(active,k,units=>{let union=0;for(const i of units)union|=masks[i];if(bitCount(union)!==k)return false;const unitSet=new Set(units),regions=new Set();for(let r=0;r<N;r++)if(union&(1<<r))regions.add(r);const affected=[];for(const region of regions)for(const c of unitCells(src,'region',region))if(candidate(c)&&!unitSet.has(kind==='row'?c.row:c.col))affected.push(c);if(!affected.length)return false;const us=units.map(x=>x+1).join(','),rs=[...regions].map(x=>x+1).join(',');found={label:(kind==='row'?'Rows ':'Columns ')+us+' 形成 Hall '+k+' 組，完整對應色塊 ['+rs+']，排除這些色塊在其他'+(kind==='row'?'列':'欄')+'的候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))};return true});if(stop)return found}return null}function reverseHallRegionDeduction(src,kind,maxSize=5,minSize=2){const snap=solverSnapshot(src),active=[];for(let region=0;region<N;region++)if(!snap.regionQueens[region])active.push(region);if(active.length<2)return null;const candidate=c=>isCandidate(c,src),masks=kind==='row'?snap.regionRowMask:snap.regionColMask;let found=null;for(let k=minSize;k<=Math.min(maxSize,active.length);k++){const stop=eachCombination(active,k,regions=>{let union=0;for(const r of regions)union|=masks[r];if(bitCount(union)!==k)return false;const regionSet=new Set(regions),units=new Set();for(let i=0;i<N;i++)if(union&(1<<i))units.add(i);const affected=[];for(const unit of units)for(const c of unitCells(src,kind,unit))if(candidate(c)&&!regionSet.has(c.regionId))affected.push(c);if(!affected.length)return false;const rs=regions.map(x=>x+1).join(','),us=[...units].map(x=>x+1).join(',');found={label:'色塊 ['+rs+'] 形成反向 Hall '+k+' 組，完整限制在 '+(kind==='row'?'Rows ':'Columns ')+us+'，排除其中其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))};return true});if(stop)return found}return null}function rowColumnRegionIntersectionDeduction(src){const snap=solverSnapshot(src);for(let r=0;r<N;r++){if(snap.rowQueens[r])continue;const region=singleBitIndex(snap.rowRegionMask[r]);if(region<0)continue;for(let col=0;col<N;col++){if(snap.colQueens[col]||singleBitIndex(snap.colRegionMask[col])!==region)continue;const cross=src[r][col];if(cross.regionId===region&&isCandidate(cross,src))return{label:'Row '+(r+1)+' 與 Column '+(col+1)+' 的候選都被 Region '+(region+1)+' 完整包覆，因此交叉點 R'+(r+1)+'C'+(col+1)+' 必為皇后',changes:[{row:r,col:col,newState:2}]}}}return null}function direct(src=cells){const bad=contradiction(src);if(bad)return{bad};for(const q of solverSnapshot(src).queens){const affected=exclusionByQueen(q,src);if(affected.length)return{label:'皇后 R'+(q.row+1)+'C'+(q.col+1)+' 排除 '+affected.length+' 格',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}for(const kind of['row','col','region'])for(let i=0;i<N;i++){const u=unitCells(src,kind,i);if(u.some(c=>c.state===2))continue;const cand=u.filter(c=>isCandidate(c,src));if(cand.length===1){const c=cand[0];return{label:unitLabel(kind,i)+' 只剩唯一候選 R'+(c.row+1)+'C'+(c.col+1),changes:[{row:c.row,col:c.col,newState:2}]}}}const cross=rowColumnRegionIntersectionDeduction(src);if(cross)return cross;for(let region=0;region<N;region++){const rc=unitCells(src,'region',region);if(rc.some(c=>c.state===2))continue;const cand=rc.filter(c=>isCandidate(c,src));if(cand.length<2)continue;const rows=[...new Set(cand.map(c=>c.row))];if(rows.length===1){const r=rows[0],affected=src[r].filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Row '+(r+1)+'，排除該列其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}const cols=[...new Set(cand.map(c=>c.col))];if(cols.length===1){const col=cols[0],affected=src.map(row=>row[col]).filter(c=>c.regionId!==region&&isCandidate(c,src));if(affected.length)return{label:'Region '+(region+1)+' 的候選全部位於 Column '+(col+1)+'，排除該欄其他色塊候選',changes:affected.map(c=>({row:c.row,col:c.col,newState:1}))}}}for(const kind of['row','col'])for(let i=0;i<N;i++){const u=unitCells(src,kind,i);if(u.some(c=>c.state===2))continue;const cand=u.filter(c=>isCandidate(c,src));if(cand.length<2)continue;const regions=[...new Set(cand.map(c=>c.regionId))];if(regions.length!==1)continue;const region=regions[0],affected=unitCells(src,'region',region).fi
